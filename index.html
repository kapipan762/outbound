<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OUTBOUND</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* layout: full-bleed 3D range, HUD pinned to the screen edges, one centered card for menu / lobby / pause / results */
:root{
  --ink:#0a0e1a; --panel:#121829; --line:#27314d; --fg:#e8ecf8; --dim:#8c97b8;
  --amber:#ffa62b; --danger:#ff3b4e; --heal:#58e08a;
  --display:"Chakra Petch","Zen Kaku Gothic New",system-ui,sans-serif;
  --body:"Zen Kaku Gothic New",system-ui,"Hiragino Sans","Yu Gothic UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--ink);color:var(--fg);font:15px/1.6 var(--body);overflow:hidden}
[hidden]{display:none!important}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#1a2238;border-radius:6px;padding:.6em 1.1em}
button:hover:not(:disabled){border-color:var(--dim)}
button:disabled{opacity:.5;cursor:default}
button.primary{background:var(--amber);border-color:var(--amber);color:#1b1200;font-weight:700;font-family:var(--display);letter-spacing:.04em;font-size:1.1rem;padding:.7em 1.4em}
button.primary:hover:not(:disabled){filter:brightness(1.1)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
input,select{background:#0d1222;border:1px solid var(--line);border-radius:6px;padding:.5em .7em;min-width:0}
input[type=range]{padding:0}
input[type=color]{padding:2px;width:44px;height:34px}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;font-family:var(--display);font-variant-numeric:tabular-nums}
#top{position:absolute;top:14px;left:50%;transform:translateX(-50%);text-align:center}
#lives{display:flex;gap:5px;justify-content:center}
#lives i{width:22px;height:8px;background:#2a3350;transform:skewX(-20deg)}
#lives i.on{background:var(--amber);box-shadow:0 0 10px rgba(255,166,43,.6)}
#lives.low i.on{background:var(--danger);box-shadow:0 0 10px rgba(255,59,78,.7)}
#clock{font-size:2rem;font-weight:700;line-height:1.2;margin-top:4px}
#lvl{color:var(--dim);letter-spacing:.12em;font-size:.8rem}
#tl{position:absolute;top:14px;left:18px}
#tl small{display:block;color:var(--dim);letter-spacing:.12em;font-size:.72rem}
#tl b{font-size:1.5rem}
#board{position:absolute;top:14px;right:18px;min-width:210px}
.row{display:grid;grid-template-columns:12px 1fr auto auto;gap:10px;align-items:center;padding:2px 0;font-size:.92rem}
.row .dot{width:10px;height:10px;border-radius:50%}
.row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--body)}
.row .ac{color:var(--dim);min-width:3.2em;text-align:right}
.row .k{min-width:2.4em;text-align:right;font-weight:700}
#xh{position:absolute;left:50%;top:50%;--c:#fff}
#xh i{position:absolute;background:var(--c);box-shadow:0 0 0 1px rgba(0,0,0,.55)}
#xh .d{width:2px;height:2px;left:-1px;top:-1px}
#xh .l{width:6px;height:2px;top:-1px;left:-11px}#xh .r{width:6px;height:2px;top:-1px;left:5px}
#xh .u{width:2px;height:6px;left:-1px;top:-11px}#xh .b{width:2px;height:6px;left:-1px;top:5px}
#hm{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px;opacity:0;
  background:linear-gradient(45deg,transparent 46%,#fff 46%,#fff 54%,transparent 54%),linear-gradient(-45deg,transparent 46%,#fff 46%,#fff 54%,transparent 54%);
  -webkit-mask:radial-gradient(circle,transparent 5px,#000 6px);mask:radial-gradient(circle,transparent 5px,#000 6px)}
#hm.go{animation:hm .18s ease-out}
@keyframes hm{from{opacity:1;transform:scale(1.25)}to{opacity:0;transform:scale(1)}}
#hurt{position:absolute;inset:0;box-shadow:inset 0 0 160px 40px rgba(255,40,60,.75);opacity:0}
#hurt.go{animation:hurt .5s ease-out}
@keyframes hurt{from{opacity:1}to{opacity:0}}
#count{position:absolute;left:50%;top:32%;transform:translate(-50%,-50%);font-size:7rem;font-weight:700;text-shadow:0 0 30px rgba(255,166,43,.6)}
#toast{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);background:rgba(18,24,41,.92);border:1px solid var(--line);border-radius:6px;padding:.5em 1em;font-family:var(--body)}
@media (prefers-reduced-motion:reduce){#hm.go,#hurt.go{animation-duration:.01s}}

/* overlays */
.ov{position:fixed;inset:0;display:grid;place-items:center;background:rgba(6,9,18,.72);padding:16px;overflow:auto}
.card{width:min(560px,100%);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:26px 28px;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-size:3rem;letter-spacing:.16em;margin:0;line-height:1}
h1 span{color:var(--amber)}
h2{font-family:var(--display);font-size:1.5rem;letter-spacing:.06em;margin:0}
.sub{color:var(--dim);margin:0}
.f{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.f>input[type=text]{flex:1}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--dim);flex:1;min-width:120px}
label.fld>*{color:var(--fg);font-size:.95rem}
.code{font-family:var(--display);font-size:2rem;letter-spacing:.3em;color:var(--amber);font-weight:700}
.sep{height:1px;background:var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.85rem;color:var(--dim)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
#msg{color:var(--danger);min-height:1.4em;margin:0}
.big{font-family:var(--display);font-size:2.2rem;font-weight:700;font-variant-numeric:tabular-nums}
details summary{cursor:pointer;color:var(--dim)}
details .f{margin-top:12px}
#cm{color:var(--dim);font-size:.85rem}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" hidden>
  <div id="hurt"></div>
  <div id="tl"><small>ROOM <span id="hcode"></span></small><small>TEAM SCORE</small><b id="tscore">0</b></div>
  <div id="top"><div id="lives"></div><div id="clock">0:00.0</div><div id="lvl">LV 1</div></div>
  <div id="board"></div>
  <div id="xh"><i class="d"></i><i class="l"></i><i class="r"></i><i class="u"></i><i class="b"></i></div>
  <div id="hm"></div>
  <div id="count" hidden></div>
  <div id="toast" hidden></div>
</div>

<div id="menu" class="ov">
  <div class="card">
    <h1>OUT<span>BOUND</span></h1>
    <p class="sub">画面外から飛んでくる的を、反対側の画面外へ抜けられる前にみんなで撃ち落とす協力エイムトレーナー。逃がすと全員で共有している残機が減ります。</p>
    <label class="fld">プレイヤー名<input id="name" type="text" maxlength="12" autocomplete="off"></label>
    <button id="create" class="primary">ルームを作る（ソロもここから）</button>
    <div class="sep"></div>
    <div class="f"><input id="joincode" type="text" maxlength="5" placeholder="ルームコード" autocomplete="off" style="text-transform:uppercase;letter-spacing:.2em"><button id="join">参加する</button></div>
    <p id="msg"></p>
    <p class="sub" style="font-size:.82rem">マウス操作専用（PCブラウザ）。Chrome / Edge 推奨。</p>
  </div>
</div>

<div id="panel" class="ov" hidden>
  <div class="card">
    <h2 id="ptitle"></h2>
    <div id="result" hidden>
      <div class="f" style="gap:28px">
        <div><div class="sub">生存時間</div><div class="big" id="rtime"></div></div>
        <div><div class="sub">チームスコア</div><div class="big" id="rscore"></div></div>
      </div>
    </div>
    <div class="f"><span class="code" id="pcode"></span><button id="copy">招待リンクをコピー</button><input id="link" type="text" readonly hidden></div>
    <p class="sub" id="pnote"></p>
    <div id="plist"></div>
    <button id="go" class="primary"></button>
    <p class="sub" style="font-size:.88rem">左クリック長押しでビーム照射。的に照準を合わせ続けるとHPが削れ、HPが0になると撃破です。複数人で同じ的を狙うと速く倒せます。</p>
    <div class="legend">
      <span><i style="background:#ffa62b"></i>通常</span><span><i style="background:#3ec5ff"></i>ジグザグ</span>
      <span><i style="background:#ff4d8d"></i>高速（小さい）</span><span><i style="background:#a06bff"></i>硬い（HP大）</span>
      <span><i style="background:#58e08a"></i>回復（残機+1・逃げても減らない）</span>
    </div>
    <details id="setd">
      <summary>感度・FOV・クロスヘア設定</summary>
      <div class="f">
        <label class="fld">感度の基準ゲーム<select id="preset">
          <option value="0.07">VALORANT</option><option value="0.022">CS2 / Apex Legends</option>
          <option value="0.0066">Overwatch 2</option><option value="0.005555">Fortnite</option></select></label>
        <label class="fld">ゲーム内感度<input id="sens" type="number" step="0.001" min="0.001"></label>
        <label class="fld">DPI<input id="dpi" type="number" step="50" min="100"></label>
      </div>
      <div id="cm"></div>
      <div class="f">
        <label class="fld">水平FOV（16:9基準）<input id="fov" type="number" min="60" max="130"></label>
        <label class="fld">音量<input id="vol" type="range" min="0" max="1" step="0.05"></label>
        <label class="fld" style="flex:0">クロスヘア<input id="xhc" type="color"></label>
      </div>
      <div class="f"><label><input id="fs" type="checkbox"> プレイ開始時にフルスクリーンにする（描画の遅延が減ります）</label></div>
    </details>
    <button id="leave">退出</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
'use strict';
/* ================= constants ================= */
const W=22,H=12,ZC=-18,MAXL=10,MAXP=8,DPS=100,PREFIX='outbound-v2-';
const COLORS=['#ffb238','#4cc9f0','#f72585','#b8f35d','#c77dff','#ff7b54','#5eead4','#f5f5f5'];
const TYPES={n:{c:0xffa62b,score:100},z:{c:0x3ec5ff,score:150},s:{c:0xff4d8d,score:150},t:{c:0xa06bff,score:300},h:{c:0x58e08a,score:50}};
const $=id=>document.getElementById(id);

/* ================= settings ================= */
const cfg={name:'',preset:'0.022',sens:1.5,dpi:800,fov:103,vol:0.5,xh:'#ffffff',fs:true};
try{Object.assign(cfg,JSON.parse(localStorage.getItem('outbound-cfg2')||'{}'))}catch(e){}
if(!cfg.name)cfg.name='Player'+Math.floor(Math.random()*900+100);
function saveCfg(){try{localStorage.setItem('outbound-cfg2',JSON.stringify(cfg))}catch(e){}}

/* ================= state ================= */
const S={phase:'menu',isHost:false,online:false,code:'',myId:null,players:new Map(),targets:new Map(),lives:MAXL,t0:0,offset:0,over:null};
const meshes=new Map(),effects=[],hpDirty=new Set();
let yaw=0,pitch=0,locked=false,session=0,locking=false,engaged=false;
let peer=null,hostConn=null;const conns=new Map();
let tid=0,nextSpawn=0,dirty=false,lastP=0,bestRtt=1e9;
const hostNow=()=>performance.now()+S.offset;

/* ================= three.js scene ================= */
const cv=$('cv');
// bisect switches for stutter hunting: ?noaa  ?nohud  ?nofog
const Q=new URLSearchParams(location.search);
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:!Q.has('noaa')});
if(Q.has('nohud')){const s=document.createElement('style');s.textContent='#hud>*:not(#xh){display:none!important}';document.head.append(s)}
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0a0e1a);if(!Q.has('nofog'))scene.fog=new THREE.Fog(0x0a0e1a,30,90);
const camera=new THREE.PerspectiveCamera(70,1,0.1,200);camera.rotation.order='YXZ';
scene.add(new THREE.HemisphereLight(0xbfd0ff,0x1a1420,0.9));
const sun=new THREE.DirectionalLight(0xffffff,0.8);sun.position.set(4,10,8);scene.add(sun);
if(!Q.has('nogrid')){ // back wall with grid texture
  const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');
  g.fillStyle='#0d1324';g.fillRect(0,0,256,256);g.strokeStyle='#1d2742';g.lineWidth=2;g.strokeRect(0,0,256,256);
  const tx=new THREE.CanvasTexture(c);tx.wrapS=tx.wrapT=THREE.RepeatWrapping;tx.repeat.set(40,20);
  const wall=new THREE.Mesh(new THREE.PlaneGeometry(160,80),new THREE.MeshBasicMaterial({map:tx}));wall.position.z=-30;scene.add(wall);
  const grid=new THREE.GridHelper(160,80,0x2a3760,0x18203a);grid.position.y=-8;scene.add(grid);
}
const frameMat=new THREE.MeshBasicMaterial({color:0x6f9bff});
const sphereGeo=new THREE.SphereGeometry(1,28,18),ringGeo=new THREE.RingGeometry(0.82,1,40);
const cBase=new THREE.Color(0x6f9bff),cRed=new THREE.Color(0xff2a3c),cTmp=new THREE.Color();
let frameFlash=-1e9;
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;
  camera.fov=2*Math.atan(Math.tan(cfg.fov*Math.PI/360)*9/16)*180/Math.PI;camera.updateProjectionMatrix()}
addEventListener('resize',resize);

/* ================= targets ================= */
const V={x:0,y:0,z:0};
function tpos(g,hn,o){const s=Math.max(0,(hn-g.t0)/1000),d=g.sp*s,w=g.amp?g.amp*Math.sin(g.fq*s):0;
  o.x=g.x+g.dx*d-g.dy*w;o.y=g.y+g.dy*d+g.dx*w;o.z=g.z;return o}
const arcMat=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.9,side:THREE.DoubleSide,depthTest:false});
function addTarget(g){g.mx=g.mx||g.hp;S.targets.set(g.id,g);const c=TYPES[g.ty].c;
  const m=new THREE.Mesh(sphereGeo,new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:0.4,roughness:0.45}));
  m.userData={base:new THREE.Color(c),flash:-1e9,arc:null,af:-1};scene.add(m);meshes.set(g.id,m)}
function removeTarget(id){S.targets.delete(id);const m=meshes.get(id);if(m){if(m.userData.arc)m.userData.arc.geometry.dispose();scene.remove(m);m.material.dispose();meshes.delete(id)}}
function updArc(m,g){const q=Math.max(0,Math.min(24,Math.round(g.hp/g.mx*24))),u=m.userData;if(q===u.af)return;u.af=q;
  if(u.arc){m.remove(u.arc);u.arc.geometry.dispose();u.arc=null}
  if(q>0&&q<24){u.arc=new THREE.Mesh(new THREE.RingGeometry(1.2,1.36,40,1,Math.PI/2,q/24*Math.PI*2),arcMat);u.arc.renderOrder=4;m.add(u.arc)}}
function clearTargets(){for(const id of [...S.targets.keys()])removeTarget(id)}
function burst(x,y,z,r,color,dur){const m=new THREE.Mesh(ringGeo,new THREE.MeshBasicMaterial({color,transparent:true,depthWrite:false,side:THREE.DoubleSide}));
  m.position.set(x,y,z);scene.add(m);effects.push({m,t:performance.now(),dur,r,kind:'ring'})}
function dirFrom(y,p,o){const cp=Math.cos(p);o.x=-Math.sin(y)*cp;o.y=Math.sin(p);o.z=-Math.cos(y)*cp;return o}
/* ================= audio ================= */
let ac=null;
function snd(k){if(!ac||cfg.vol<=0)return;const P={trk:[430,470,.05,.1,'sine'],hit:[900,1300,.06,.35,'sine'],kill:[700,1800,.11,.45,'triangle'],hurt:[170,55,.4,.7,'sawtooth'],heal:[520,1040,.25,.4,'sine']}[k];
  const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type=P[4];o.frequency.setValueAtTime(P[0],t);o.frequency.exponentialRampToValueAtTime(P[1],t+P[2]);
  g.gain.setValueAtTime(P[3]*cfg.vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+P[2]);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+P[2]+0.02)}
function initAudio(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}else if(ac.state==='suspended')ac.resume()}

/* ================= networking ================= */
function rawBroadcast(m,except){for(const [id,c] of conns)if(id!==except&&c.open)c.send(m)}
function emit(m){apply(m);rawBroadcast(m)}                       // host: apply locally + send to everyone
function send(m){if(S.isHost)hostHandle(S.myId,m);else if(hostConn&&hostConn.open)hostConn.send(m)}
const plist=()=>[...S.players.values()].map(p=>({id:p.id,name:p.name,ci:p.ci,kills:p.kills,shots:p.shots,hits:p.hits,score:p.score}));
function emitPlayers(){dirty=false;lastP=performance.now();emit({t:'players',list:plist()})}
function newPlayer(id,name){const used=new Set([...S.players.values()].map(p=>p.ci));let ci=0;while(used.has(ci))ci++;
  name=String(name||'Player').replace(/[\u0000-\u001f]/g,'').slice(0,12)||'Player';
  return {id,name,ci,kills:0,shots:0,hits:0,score:0,y:0,p:0,ty:0,tp:0,f:0}}
function genCode(){const a='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<5;i++)s+=a[Math.floor(Math.random()*a.length)];return s}

function createRoom(tries){
  const my=++session,code=genCode();$('msg').textContent='ルームを作成中…';
  S.isHost=true;S.offset=0;S.myId='host';let entered=false;
  const enter=online=>{if(entered||my!==session)return;entered=true;S.code=code;S.online=online;S.players=new Map();
    S.players.set('host',newPlayer('host',cfg.name));S.phase='lobby';S.lives=MAXL;S.over=null;$('msg').textContent='';
    if(!online)toast('シグナリングサーバーに繋がらないため、ソロ専用で起動しました');refreshUI()};
  if(typeof Peer==='undefined'){enter(false);return}
  let p;try{p=new Peer(PREFIX+code,{debug:1})}catch(e){enter(false);return}
  peer=p;
  p.on('open',()=>enter(true));
  p.on('error',e=>{if(my!==session)return;if(e.type==='unavailable-id'&&!entered&&(tries||0)<3){p.destroy();createRoom((tries||0)+1);return}enter(false)});
  p.on('disconnected',()=>{if(my===session&&!p.destroyed)try{p.reconnect()}catch(e){}});
  p.on('connection',c=>{
    c.on('open',()=>{if(my!==session)return;if(conns.size+1>=MAXP){c.send({t:'full'});setTimeout(()=>c.close(),400);return}conns.set(c.peer,c)});
    c.on('data',m=>{if(my===session&&conns.get(c.peer)===c)hostHandle(c.peer,m)});
    c.on('close',()=>{if(my===session)dropPeer(c.peer,c)});
    c.on('error',()=>{if(my===session)dropPeer(c.peer,c)});
  });
}
function dropPeer(id,c){if(conns.get(id)!==c)return;conns.delete(id);const p=S.players.get(id);if(p){removeRing(p);S.players.delete(id);emitPlayers()}}

function joinRoom(code){
  if(typeof Peer==='undefined'){$('msg').textContent='通信ライブラリを読み込めませんでした';return}
  const my=++session;$('msg').textContent='接続中…';S.isHost=false;S.online=true;bestRtt=1e9;
  const p=new Peer(undefined,{debug:1});peer=p;
  p.on('open',()=>{if(my!==session)return;
    const c=p.connect(PREFIX+code,{reliable:true,serialization:'json'});hostConn=c;
    const to=setTimeout(()=>{if(my===session&&!c.open)leave('接続がタイムアウトしました。ネットワーク環境によっては直接接続できない場合があります')},12000);
    c.on('open',()=>{clearTimeout(to);if(my!==session)return;S.code=code;c.send({t:'hello',name:cfg.name});
      let n=0;const f=()=>{if(my!==session||!c.open)return;c.send({t:'ping',c:performance.now()});setTimeout(f,++n<6?250:10000)};f()});
    c.on('data',m=>{if(my===session)apply(m)});
    c.on('close',()=>{if(my===session)leave('ホストとの接続が切れました')});
  });
  p.on('error',e=>{if(my===session)leave(e.type==='peer-unavailable'?'ルームが見つかりません':'接続エラー: '+e.type)});
}
function leave(msg){session++;try{peer&&peer.destroy()}catch(e){}peer=null;hostConn=null;conns.clear();
  for(const p of S.players.values())removeRing(p);S.players=new Map();clearTargets();S.phase='menu';S.over=null;
  if(document.pointerLockElement)document.exitPointerLock();$('msg').textContent=msg||'';refreshUI()}

/* ---- host: messages from players (including the host itself) ---- */
function hostHandle(id,m){
  if(!m||typeof m!=='object')return;
  switch(m.t){
    case 'hello':{if(S.players.has(id))return;const c=conns.get(id);if(!c)return;S.players.set(id,newPlayer(id,m.name));
      c.send({t:'welcome',id,phase:S.phase,t0:S.t0,lives:S.lives,targets:[...S.targets.values()],over:S.over});emitPlayers();break}
    case 'ping':{const c=conns.get(id);if(c)c.send({t:'pong',c:m.c,h:performance.now()});break}
    case 'aim':{const p=S.players.get(id);if(p&&id!==S.myId){p.ty=+m.y||0;p.tp=+m.p||0;p.f=m.f?1:0;
      if(m.f&&S.phase==='playing')hostBeam(id,typeof m.h==='number'?m.h:null,Math.min(0.15,Math.max(0,+m.dt||0.05)))}break}
  }
}
/* ---- host: simulation ---- */
const SPAWN_DELAY=0.35; // seconds before a freed slot gets a new target
function hostBeam(id,hid,dt){
  const p=S.players.get(id);if(!p||S.phase!=='playing')return;p.shots++;dirty=true;
  const g=hid!=null?S.targets.get(hid):null;if(!g)return;p.hits++;
  g.hp-=DPS*dt;hpDirty.add(g.id);
  if(g.hp<=0){p.kills++;p.score+=TYPES[g.ty].score;if(g.ty==='h'&&S.lives<MAXL)S.lives++;hpDirty.delete(g.id);emit({t:'kill',id:g.id,by:id,lives:S.lives})}
}
// targets enter from just outside one screen edge, cross the field, and leave past the opposite edge
function spawn(gs,n){
  let r=Math.max(0.6,1.05-0.003*gs),sp=Math.min(30,7+0.12*gs)*(0.8+Math.random()*0.4),ty='n',hp=60,amp=0,fq=0;
  const pz=gs>20?Math.min(0.25,(gs-20)*0.006):0,ps=gs>40?Math.min(0.2,(gs-40)*0.005):0,pt=gs>60?Math.min(0.12,(gs-60)*0.003):0,ph=(gs>15&&S.lives<MAXL)?0.05:0;
  const u=Math.random();
  if(u<ph){ty='h';r*=0.85;sp*=1.1;hp=40}
  else if(u<ph+pt){ty='t';r*=1.5;sp*=0.6;hp=n>=4?300:200}
  else if(u<ph+pt+ps){ty='s';r*=0.7;sp*=1.7;hp=45}
  else if(u<ph+pt+ps+pz){ty='z';amp=1.6;fq=3;hp=80}
  if(ty!=='h')hp*=1+gs/150;
  const m=r+1.5,sg=Math.random()<0.5?-1:1,rnd=()=>Math.random()*2-1;let x,y,tx,tyy;
  if(Math.random()<0.7){x=sg*(W+m);tx=-x;y=rnd()*H*0.85;tyy=rnd()*H*0.85}
  else{y=sg*(H+m);tyy=-y;x=rnd()*W*0.85;tx=rnd()*W*0.85}
  let dx=tx-x,dy=tyy-y;const l=Math.hypot(dx,dy);dx/=l;dy/=l;
  emit({t:'spawn',g:{id:++tid,ty,x,y,z:ZC+(Math.random()-0.5)*3,dx,dy,sp,r,hp,mx:hp,amp,fq,t0:S.t0+gs*1000}});
}
function hostStart(){for(const p of S.players.values()){p.kills=p.shots=p.hits=p.score=0;p.f=0}hpDirty.clear();nextSpawn=0.3;
  emit({t:'start',t0:performance.now()+4000});emitPlayers()}
function hostTick(){
  if(S.phase!=='playing')return;const hn=hostNow(),gt=(hn-S.t0)/1000;if(gt<0)return;
  for(const g of [...S.targets.values()]){tpos(g,hn,V);
    if(Math.abs(V.x)<W&&Math.abs(V.y)<H)g.in=true;
    else if(g.in||hn-g.t0>25000){const cost=!!g.in&&g.ty!=='h';if(cost)S.lives--;
      emit({t:'esc',id:g.id,cost,lives:S.lives,x:Math.max(-W,Math.min(W,V.x)),y:Math.max(-H,Math.min(H,V.y))});
      if(S.lives<=0){emit({t:'over',time:gt,list:plist()});return}}}
  // at most one target per player on screen; when one is killed/escapes, a replacement follows after a short beat
  const n=S.players.size;
  if(S.targets.size<n&&gt>=nextSpawn){spawn(gt,n);nextSpawn=gt+SPAWN_DELAY}
}
let lastBeam=performance.now(),tickN=0;
setInterval(()=>{
  if(S.phase==='menu')return;
  const now=performance.now(),dt=Math.min(0.15,Math.max(0.01,(now-lastBeam)/1000));lastBeam=now;
  const f=firing&&locked&&S.phase==='playing'&&hostNow()>=S.t0,h=f?pick():null;
  $('hm').style.opacity=h!=null?'.85':'';
  if(h!=null&&(++tickN&1))snd('trk');
  if(S.isHost){
    const me=S.players.get('host');if(me)me.f=f?1:0;
    if(f)hostBeam('host',h,dt);
    hostTick();
    if(conns.size){const a={};for(const p of S.players.values())a[p.id]=[r3(p.id===S.myId?yaw:p.ty),r3(p.id===S.myId?pitch:p.tp),p.f?1:0];rawBroadcast({t:'aims',a})}
    if(hpDirty.size){const a={};for(const id of hpDirty){const g=S.targets.get(id);if(g)a[id]=Math.round(Math.max(0,g.hp)*10)/10}hpDirty.clear();emit({t:'hps',a})}
    if(dirty&&now-lastP>300)emitPlayers();
  }else if(hostConn&&hostConn.open&&S.phase==='playing')hostConn.send({t:'aim',y:r3(yaw),p:r3(pitch),f:f?1:0,h,dt:r3(dt)});
},50);
const r3=v=>Math.round(v*1000)/1000;

/* ---- everyone: apply events from the host ---- */
function setPlayers(list){const old=S.players,nm=new Map();
  for(const d of list){const o=old.get(d.id)||{y:0,p:0,ty:0,tp:0};nm.set(d.id,Object.assign(o,d))}
  for(const [id,o] of old)if(!nm.has(id))removeRing(o);S.players=nm}
function removeRing(p){if(p.ring){scene.remove(p.ring);p.ring.material.dispose();p.ring=null}if(p.beam){scene.remove(p.beam);p.beam.geometry.dispose();p.beam.material.dispose();p.beam=null}}
function apply(m){
  if(!m||typeof m!=='object')return;
  switch(m.t){
    case 'welcome':S.myId=m.id;S.phase=m.phase;S.t0=m.t0;S.lives=m.lives;S.over=m.over;clearTargets();m.targets.forEach(addTarget);$('msg').textContent='';refreshUI();break;
    case 'players':setPlayers(m.list);renderBoards();break;
    case 'pong':{const now=performance.now(),rtt=now-m.c;if(rtt<bestRtt){bestRtt=rtt;S.offset=m.h+rtt/2-now}break}
    case 'start':engaged=false;S.phase='playing';S.t0=m.t0;S.lives=MAXL;S.over=null;clearTargets();refreshUI();break;
    case 'spawn':if(S.phase==='playing')addTarget(m.g);break;
    case 'hps':{const now=performance.now();for(const id in m.a){const g=S.targets.get(+id),ms=meshes.get(+id);if(g)g.hp=m.a[id];if(ms)ms.userData.flash=now}break}
    case 'kill':{const g=S.targets.get(m.id);if(g){tpos(g,hostNow(),V);const pl=S.players.get(m.by);
        burst(V.x,V.y,V.z,g.r,pl?COLORS[pl.ci]:'#ffffff',260);if(g.ty==='h')snd('heal')}
      if(m.by===S.myId){snd('kill');const h=$('hm');h.classList.remove('go');void h.offsetWidth;h.classList.add('go')}
      removeTarget(m.id);S.lives=m.lives;renderLives();break}
    case 'esc':{removeTarget(m.id);if(m.cost){S.lives=m.lives;renderLives();burst(m.x,m.y,ZC,0.9,'#ff2a3c',450);frameFlash=performance.now();
        const h=$('hurt');h.classList.remove('go');void h.offsetWidth;h.classList.add('go');snd('hurt')}break}
    case 'over':S.phase='over';S.over={time:m.time,list:m.list};clearTargets();if(document.pointerLockElement)document.exitPointerLock();refreshUI();break;
    case 'aims':for(const id in m.a){if(id===S.myId)continue;const p=S.players.get(id);if(p){p.ty=m.a[id][0];p.tp=m.a[id][1];p.f=m.a[id][2]}}break;
    case 'full':leave('ルームが満員です（最大'+MAXP+'人）');break;
  }
}

/* ================= input ================= */
function lock(){initAudio();if(document.pointerLockElement===cv)return;locking=true;setTimeout(()=>{locking=false;refreshUI()},1200);
  const go=()=>{if(Q.has('noraw')){try{cv.requestPointerLock()}catch(e){}return}
    try{const r=cv.requestPointerLock({unadjustedMovement:true});if(r&&r.catch)r.catch(()=>{try{cv.requestPointerLock()}catch(e){}})}catch(e){try{cv.requestPointerLock()}catch(e2){}}};
  // fullscreen lets the browser present directly instead of going through the desktop compositor (less buffering, esp. with mixed-refresh multi-monitor)
  if(cfg.fs&&!document.fullscreenElement&&document.documentElement.requestFullscreen){
    document.documentElement.requestFullscreen({navigationUI:'hide'}).then(go,go)}else go()}
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===cv;if(locked){engaged=true;locking=false}else firing=false;refreshUI()});
// pointerrawupdate delivers each mouse report immediately; mousemove is batched to one per frame, which felt laggy on fast flicks.
// ?nopru falls back to mousemove; ?noraw = pointer lock without unadjustedMovement
const MOVE_EV=(!Q.has('nopru')&&('onpointerrawupdate' in window))?'pointerrawupdate':'mousemove';
document.addEventListener(MOVE_EV,e=>{if(!locked)return;const k=cfg.sens*parseFloat(cfg.preset)*Math.PI/180;
  yaw-=e.movementX*k;pitch=Math.max(-1.48,Math.min(1.48,pitch-e.movementY*k))});
let firing=false;
document.addEventListener('mousedown',e=>{if(locked&&e.button===0)firing=true});
document.addEventListener('mouseup',e=>{if(e.button===0)firing=false});
addEventListener('blur',()=>{firing=false});
const D={};
function pick(){
  if(S.phase!=='playing')return null;const hn=hostNow();if(hn<S.t0)return null;
  dirFrom(yaw,pitch,D);let best=null,bb=1e9;
  for(const g of S.targets.values()){tpos(g,hn,V);const b=V.x*D.x+V.y*D.y+V.z*D.z;if(b<=0)continue;
    const d2=V.x*V.x+V.y*V.y+V.z*V.z-b*b;if(d2<=g.r*g.r&&b<bb){bb=b;best=g}}
  return best?best.id:null}

/* ================= UI ================= */
function fmtT(s){s=Math.max(0,s);const m=Math.floor(s/60);return m+':'+(s-m*60).toFixed(1).padStart(4,'0')}
function boardRows(el,list){el.textContent='';for(const p of list){const r=document.createElement('div');r.className='row';
  const d=document.createElement('span');d.className='dot';d.style.background=COLORS[p.ci];
  const n=document.createElement('span');n.className='nm';n.textContent=p.name+(p.id===S.myId?'（自分）':'')+(p.id==='host'?' ★':'');
  const a=document.createElement('span');a.className='ac';a.textContent=p.shots?Math.round(p.hits/p.shots*100)+'%':'–';
  const k=document.createElement('span');k.className='k';k.textContent=p.kills;r.append(d,n,a,k);el.append(r)}}
function renderBoards(){const list=(S.phase==='over'&&S.over?S.over.list:[...S.players.values()]).slice().sort((a,b)=>b.kills-a.kills);
  boardRows($('board'),list);boardRows($('plist'),list);
  $('tscore').textContent=list.reduce((s,p)=>s+p.score,0).toLocaleString();
  if(S.phase==='over'&&S.over)$('rscore').textContent=S.over.list.reduce((s,p)=>s+p.score,0).toLocaleString()}
function renderLives(){const el=$('lives');if(!el.children.length)for(let i=0;i<MAXL;i++)el.append(document.createElement('i'));
  [...el.children].forEach((c,i)=>c.classList.toggle('on',i<S.lives));el.classList.toggle('low',S.lives<=3)}
let toastT=0;function toast(s){const t=$('toast');t.textContent=s;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,5000)}
function refreshUI(){
  const ph=S.phase;$('menu').hidden=ph!=='menu';$('hud').hidden=ph==='menu';$('panel').hidden=ph==='menu'||locked||(locking&&ph==='playing');
  if(ph==='menu')return;
  $('hcode').textContent=S.online?S.code:'SOLO';$('pcode').textContent=S.online?S.code:'SOLO';$('copy').hidden=!S.online;
  $('ptitle').textContent=ph==='lobby'?'ロビー':ph==='over'?'ゲームオーバー':engaged?'一時停止中（ゲームは進行中）':'ゲーム開始！';
  $('result').hidden=ph!=='over';if(ph==='over'&&S.over)$('rtime').textContent=fmtT(S.over.time);
  $('pnote').textContent=ph==='lobby'?(S.online?'コードかリンクを共有すると、最大'+MAXP+'人まで参加できます。途中参加もできます。':'オフラインのためソロ専用です。'):'';
  const go=$('go');
  if(ph==='playing'){go.textContent='クリックして射撃位置につく';go.disabled=false}
  else if(S.isHost){go.textContent=ph==='over'?'もう一度':'ゲーム開始';go.disabled=false}
  else{go.textContent=ph==='over'?'ホストの再開を待っています':'ホストの開始を待っています';go.disabled=true}
  renderLives();renderBoards();
}
$('go').onclick=()=>{if(S.phase!=='playing'&&S.isHost)hostStart();lock()};
$('create').onclick=()=>{readName();initAudio();createRoom(0)};
$('join').onclick=()=>{readName();initAudio();const c=$('joincode').value.trim().toUpperCase();if(c.length!==5){$('msg').textContent='5文字のルームコードを入力してください';return}joinRoom(c)};
$('joincode').onkeydown=e=>{if(e.key==='Enter')$('join').click()};
$('leave').onclick=()=>leave('');
$('copy').onclick=()=>{const url=location.href.split('#')[0]+'#'+S.code,b=$('copy');
  const fb=()=>{const l=$('link');l.hidden=false;l.value=url;l.select()};
  if(navigator.clipboard)navigator.clipboard.writeText(url).then(()=>{b.textContent='コピーしました';setTimeout(()=>b.textContent='招待リンクをコピー',1500)},fb);else fb()};
function readName(){cfg.name=$('name').value.trim().slice(0,12)||cfg.name;saveCfg()}
function syncSettings(){$('name').value=cfg.name;$('preset').value=cfg.preset;$('sens').value=cfg.sens;$('dpi').value=cfg.dpi;$('fov').value=cfg.fov;$('vol').value=cfg.vol;$('xhc').value=cfg.xh;
  $('xh').style.setProperty('--c',cfg.xh);const deg=cfg.sens*parseFloat(cfg.preset);
  $('cm').textContent='振り向き: 約 '+(360/(deg*cfg.dpi)*2.54).toFixed(1)+' cm / 360°';resize()}
for(const [id,key,num] of [['preset','preset',0],['sens','sens',1],['dpi','dpi',1],['fov','fov',1],['vol','vol',1],['xhc','xh',0]])
  $(id).addEventListener('input',e=>{let v=e.target.value;if(num){v=parseFloat(v);if(!(v>0)&&key!=='vol')return;if(key==='fov')v=Math.max(60,Math.min(130,v))}cfg[key]=v;saveCfg();
    $('xh').style.setProperty('--c',cfg.xh);const deg=cfg.sens*parseFloat(cfg.preset);$('cm').textContent='振り向き: 約 '+(360/(deg*cfg.dpi)*2.54).toFixed(1)+' cm / 360°';resize()});
$('fs').checked=!!cfg.fs;$('fs').addEventListener('change',e=>{cfg.fs=e.target.checked;saveCfg()});
{const h=location.hash.replace('#','').toUpperCase();if(/^[A-Z0-9]{5}$/.test(h))$('joincode').value=h}

/* ================= render loop ================= */
let lastClock='',lastLv='';
// ?debug in the URL: on-screen frame-time / input stats to find stutter
const DBG=/[?&]debug/.test(location.search),dbg={el:null,last:0,max:0,n:0,t:0,ev:0,mx:0,lt:0};
if(DBG){dbg.el=document.createElement('pre');dbg.el.style.cssText='position:fixed;left:8px;bottom:8px;margin:0;padding:6px 8px;background:rgba(0,0,0,.7);color:#7CFC00;font:12px/1.4 monospace;z-index:99;pointer-events:none';document.body.append(dbg.el);
  Object.assign(dbg,{lag:0,gap:0,fe:0,p1:0,p2:0});
  // lag = how long after the OS timestamp the event reached JS; gap = a frame with no input between two frames that had input (stall then burst)
  document.addEventListener(MOVE_EV,e=>{dbg.ev++;dbg.fe++;dbg.mx=Math.max(dbg.mx,Math.abs(e.movementX)+Math.abs(e.movementY));dbg.lag=Math.max(dbg.lag,performance.now()-e.timeStamp)});
  try{new PerformanceObserver(l=>{for(const e of l.getEntries())dbg.lt=Math.max(dbg.lt,e.duration)}).observe({entryTypes:['longtask']})}catch(e){}}
function frame(){
  requestAnimationFrame(frame);const now=performance.now(),hn=hostNow();
  if(DBG){if(dbg.last){const d=now-dbg.last;dbg.max=Math.max(dbg.max,d);dbg.n++}dbg.last=now;
    if(dbg.p1===0&&dbg.p2>0&&dbg.fe>0)dbg.gap++;dbg.p2=dbg.p1;dbg.p1=dbg.fe;dbg.fe=0;
    if(now-dbg.t>1000){dbg.el.textContent='fps '+dbg.n+'\nworst frame '+dbg.max.toFixed(1)+' ms\nlongest task '+dbg.lt.toFixed(0)+' ms\nmouse ev/s '+dbg.ev+'\nmax move/ev '+dbg.mx+' px\ninput lag max '+dbg.lag.toFixed(1)+' ms\ninput gaps '+dbg.gap+'\ntargets '+S.targets.size;dbg.t=now;dbg.n=0;dbg.max=0;dbg.ev=0;dbg.mx=0;dbg.lt=0;dbg.lag=0;dbg.gap=0}}
  if(S.phase==='menu'){camera.rotation.set(Math.sin(now/5000)*0.04,Math.sin(now/7000)*0.25,0)}else camera.rotation.set(pitch,yaw,0);
  for(const [id,g] of S.targets){const m=meshes.get(id);if(!m)continue;tpos(g,hn,V);m.position.set(V.x,V.y,V.z);
    m.scale.setScalar(g.r);updArc(m,g);
    const e=Math.max(Math.abs(V.x)/W,Math.abs(V.y)/H),out=V.x*g.dx+V.y*g.dy>0,dg=(g.ty==='h'||!out)?0:Math.max(0,Math.min(1,(e-0.75)/0.25)),fl=Math.max(0,1-(now-m.userData.flash)/150);
    cTmp.copy(m.userData.base).lerp(cRed,dg);m.material.color.copy(cTmp);m.material.emissive.copy(cTmp);
    m.material.emissiveIntensity=0.4+dg*0.5*(0.6+0.4*Math.sin(now/60))+fl*1.2}
  for(let i=effects.length-1;i>=0;i--){const f=effects[i],k=(now-f.t)/f.dur;
    if(k>=1){scene.remove(f.m);f.m.material.dispose();if(f.kind==='line')f.m.geometry.dispose();effects.splice(i,1);continue}
    if(f.kind==='ring'){f.m.scale.setScalar(f.r*(1+k*1.6));f.m.material.opacity=1-k}else f.m.material.opacity=0.7*(1-k)}
  frameMat.color.copy(cRed).lerp(cBase,Math.min(1,(now-frameFlash)/450));
  for(const p of S.players.values()){if(p.id===S.myId)continue;
    if(!p.ring){p.ring=new THREE.Mesh(ringGeo,new THREE.MeshBasicMaterial({color:COLORS[p.ci],transparent:true,opacity:0.85,depthTest:false}));p.ring.scale.setScalar(0.28);p.ring.renderOrder=5;scene.add(p.ring)}
    p.y+=(p.ty-p.y)*0.35;p.p+=(p.tp-p.p)*0.35;dirFrom(p.y,p.p,D);
    const vis=S.phase==='playing'&&D.z<-0.05;p.ring.visible=vis;if(vis){const k=(ZC+1.5)/D.z;p.ring.position.set(D.x*k,D.y*k,ZC+1.5)}
    if(!p.beam){p.beam=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,-1.4,-1.5),new THREE.Vector3(0,0,ZC)]),new THREE.LineBasicMaterial({color:COLORS[p.ci],transparent:true,opacity:0.6}));p.beam.frustumCulled=false;scene.add(p.beam)}
    const bv=vis&&!!p.f;p.beam.visible=bv;if(bv){const k=ZC/D.z,a=p.beam.geometry.attributes.position;a.setXYZ(1,D.x*k,D.y*k,ZC);a.needsUpdate=true}}
  if(S.phase==='playing'){const gt=(hn-S.t0)/1000,c=$('count');
    if(gt<0){c.hidden=false;c.textContent=Math.ceil(-gt)}else c.hidden=true;
    const ct=fmtT(gt),lv='LV '+(1+Math.floor(Math.max(0,gt)/20));
    if(ct!==lastClock){lastClock=ct;$('clock').textContent=ct}if(lv!==lastLv){lastLv=lv;$('lvl').textContent=lv}}
  else{$('count').hidden=true;if(S.phase==='over'&&S.over)$('clock').textContent=fmtT(S.over.time)}
  renderer.render(scene,camera);
}
syncSettings();refreshUI();frame();
</script>
</body>
