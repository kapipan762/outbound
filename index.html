<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OUTBOUND</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* layout: full-bleed 3D range, HUD pinned to the screen edges, one centered card for menu / lobby / pause / results */
:root{
  --ink:#0a0e1a; --panel:#121829; --line:#27314d; --fg:#e8ecf8; --dim:#8c97b8;
  --amber:#ffa62b; --danger:#ff3b4e; --heal:#58e08a;
  --display:"Chakra Petch","Zen Kaku Gothic New",system-ui,sans-serif;
  --body:"Zen Kaku Gothic New",system-ui,"Hiragino Sans","Yu Gothic UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--ink);color:var(--fg);font:15px/1.6 var(--body);overflow:hidden}
[hidden]{display:none!important}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#1a2238;border-radius:6px;padding:.6em 1.1em}
button:hover:not(:disabled){border-color:var(--dim)}
button:disabled{opacity:.5;cursor:default}
button.primary{background:var(--amber);border-color:var(--amber);color:#1b1200;font-weight:700;font-family:var(--display);letter-spacing:.04em;font-size:1.1rem;padding:.7em 1.4em}
button.primary:hover:not(:disabled){filter:brightness(1.1)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
input,select{background:#0d1222;border:1px solid var(--line);border-radius:6px;padding:.5em .7em;min-width:0}
input[type=range]{padding:0}
input[type=color]{padding:2px;width:44px;height:34px}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;font-family:var(--display);font-variant-numeric:tabular-nums}
#top{position:absolute;top:14px;left:50%;transform:translateX(-50%);text-align:center}
#lives{display:flex;gap:8px;justify-content:center}
#lives i{width:46px;height:16px;background:#2a3350;transform:skewX(-20deg)}
#lives i.on{background:var(--amber);box-shadow:0 0 14px rgba(255,166,43,.6)}
#lives.low i.on{background:var(--danger);box-shadow:0 0 14px rgba(255,59,78,.7)}
#clock{font-size:2rem;font-weight:700;line-height:1.2;margin-top:4px}
#lvl{color:var(--dim);letter-spacing:.12em;font-size:.8rem}
#tl{position:absolute;top:14px;left:18px}
#tl small{display:block;color:var(--dim);letter-spacing:.12em;font-size:.72rem}
#tl b{font-size:1.5rem}
#board{position:absolute;top:14px;right:18px;min-width:210px}
.row{display:grid;grid-template-columns:12px 1fr auto auto;gap:10px;align-items:center;padding:2px 0;font-size:.92rem}
.row .dot{width:10px;height:10px;border-radius:50%}
.row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--body)}
.row .ac{color:var(--dim);min-width:3.2em;text-align:right}
.row .k{min-width:2.4em;text-align:right;font-weight:700}
.rrow{display:grid;grid-template-columns:1.6em 12px 1fr auto auto auto;gap:10px;align-items:center;padding:5px 0;font-size:.95rem;border-bottom:1px solid var(--line)}
.rrow:last-child{border-bottom:0}
.rrow .pos{font-family:var(--display);font-weight:700;color:var(--dim);text-align:center}
.rrow:first-child .pos{color:var(--amber)}
.rrow .dot{width:10px;height:10px;border-radius:50%}
.rrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .tr{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:.85rem;min-width:7.5em}
.rrow .ac{color:var(--dim);min-width:3em;text-align:right}
.rrow .k{min-width:4.2em;text-align:right;font-weight:700;font-family:var(--display)}
.rrow .ok{color:var(--heal);font-weight:700}
#xh{position:absolute;left:50%;top:50%;--c:#fff}
#xh i{position:absolute;background:var(--c);box-shadow:0 0 0 1px rgba(0,0,0,.55)}
#xh .d{width:2px;height:2px;left:-1px;top:-1px}
#xh .l{width:6px;height:2px;top:-1px;left:-11px}#xh .r{width:6px;height:2px;top:-1px;left:5px}
#xh .u{width:2px;height:6px;left:-1px;top:-11px}#xh .b{width:2px;height:6px;left:-1px;top:5px}
#hm{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px;opacity:0;
  background:linear-gradient(45deg,transparent 46%,#fff 46%,#fff 54%,transparent 54%),linear-gradient(-45deg,transparent 46%,#fff 46%,#fff 54%,transparent 54%);
  -webkit-mask:radial-gradient(circle,transparent 5px,#000 6px);mask:radial-gradient(circle,transparent 5px,#000 6px)}
#hm.go{animation:hm .18s ease-out}
@keyframes hm{from{opacity:1;transform:scale(1.25)}to{opacity:0;transform:scale(1)}}
#hurt{position:absolute;inset:0;box-shadow:inset 0 0 160px 40px rgba(255,40,60,.75);opacity:0}
#hurt.go{animation:hurt .5s ease-out}
@keyframes hurt{from{opacity:1}to{opacity:0}}
#count{position:absolute;left:50%;top:32%;transform:translate(-50%,-50%);font-size:7rem;font-weight:700;text-shadow:0 0 30px rgba(255,166,43,.6)}
#toast{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);background:rgba(18,24,41,.92);border:1px solid var(--line);border-radius:6px;padding:.5em 1em;font-family:var(--body)}
#toast{bottom:150px!important}
#rank{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:min(700px,92vw)}
#rk-top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:8px}
#rk-me{display:flex;align-items:center;gap:12px}
#rk-r{display:flex;gap:22px;text-align:right}
#rank small{display:block;color:var(--dim);font-size:.68rem;letter-spacing:.14em}
#rk-nm,#rk-pos,#rk-sc{font-size:1.6rem;line-height:1;font-weight:700}
#rk-of{color:var(--dim);font-size:1rem}
.hx{display:inline-block;width:18px;height:20px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
#rk-me .hx{width:30px;height:34px}
#rk-names,#rk-segs,#rg-names,#rg-segs{display:flex;gap:6px}
#rk-names>div,#rg-names>div{flex:1;text-align:center;font-size:.85rem;color:var(--dim);padding-bottom:4px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
#rk-names>div.cur,#rg-names>div.cur{color:#ffd35a}
#rk-segs,#rg-segs{margin-top:6px}
.sg{flex:1;height:28px;background:#1b2238;transform:skewX(-20deg);position:relative;overflow:hidden;border-radius:2px}
.sg i{position:absolute;left:0;top:0;bottom:0;background:#a8903c}
.sg b{position:absolute;inset:0;transform:skewX(20deg);display:grid;place-items:center;font-size:.85rem;text-shadow:0 1px 2px #000}
#hint{position:absolute;left:50%;top:58%;transform:translateX(-50%);background:rgba(18,24,41,.92);border:1px solid var(--amber);color:var(--amber);border-radius:6px;padding:.5em 1.2em;font-family:var(--display);letter-spacing:.06em}
@media (prefers-reduced-motion:reduce){#hm.go,#hurt.go{animation-duration:.01s}}

/* overlays */
.ov{position:fixed;inset:0;display:grid;place-items:center;background:rgba(6,9,18,.72);padding:16px;overflow:auto}
.card{width:min(560px,100%);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:26px 28px;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-size:3rem;letter-spacing:.16em;margin:0;line-height:1}
h1 span{color:var(--amber)}
h2{font-family:var(--display);font-size:1.5rem;letter-spacing:.06em;margin:0}
.sub{color:var(--dim);margin:0}
.f{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.f>input[type=text]{flex:1}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--dim);flex:1;min-width:120px}
label.fld>*{color:var(--fg);font-size:.95rem}
.code{font-family:var(--display);font-size:2rem;letter-spacing:.3em;color:var(--amber);font-weight:700}
.sep{height:1px;background:var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.85rem;color:var(--dim)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
#msg{color:var(--danger);min-height:1.4em;margin:0}
.big{font-family:var(--display);font-size:2.2rem;font-weight:700;font-variant-numeric:tabular-nums}
details summary{cursor:pointer;color:var(--dim)}
details .f{margin-top:12px}
#cm{color:var(--dim);font-size:.85rem}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" hidden>
  <div id="hurt"></div>
  <div id="tl"><small>ROOM <span id="hcode"></span></small><div id="clock">0:00.0</div><div id="lvl">LV 1</div></div>
  <div id="top"><div id="lives"></div></div>
  <div id="board"></div>
  <div id="xh"><i class="d"></i><i class="l"></i><i class="r"></i><i class="u"></i><i class="b"></i></div>
  <div id="hm"></div>
  <div id="count" hidden></div>
  <div id="toast" hidden></div>
  <div id="hint" hidden>クリック / ボタンで開始</div>
  <div id="rank" hidden>
    <div id="rk-top">
      <div id="rk-me"><span id="rk-ic"></span><div><small>YOUR RANK</small><b id="rk-nm"></b></div></div>
      <div id="rk-r"><div><small>TEAM</small><b id="rk-pos"></b><span id="rk-of"></span></div><div><small>YOUR SCORE</small><b id="rk-sc"></b></div></div>
    </div>
    <div id="rk-names"></div><div id="rk-segs"></div>
  </div>
</div>

<div id="menu" class="ov">
  <div class="card">
    <h1>OUT<span>BOUND</span></h1>
    <label class="fld">プレイヤー名<input id="name" type="text" maxlength="12" autocomplete="off"></label>
    <button id="create" class="primary">ルームを作る（ソロもここから）</button>
    <div class="sep"></div>
    <div class="f"><input id="joincode" type="text" maxlength="5" placeholder="ルームコード" autocomplete="off" style="text-transform:uppercase;letter-spacing:.2em"><button id="join" class="primary">参加する</button></div>
    <p id="msg"></p>
  </div>
</div>

<div id="panel" class="ov" hidden>
  <div class="card">
    <h2 id="ptitle"></h2>
    <div id="result" hidden>
      <div class="f" style="gap:28px">
        <div><div class="sub">生存時間</div><div class="big" id="rtime"></div></div>
        <div><div class="sub">チームスコア</div><div class="big" id="rscore"></div></div>
        <div><div class="sub">ランク</div><div class="big" id="rrank" style="display:flex;align-items:center;gap:8px"></div></div>
      </div>
      <div id="rg" style="margin:16px 0 0;padding:0 10px"><div id="rg-names"></div><div id="rg-segs"></div></div>
    </div>
    <div class="f" id="prow"><span class="code" id="pcode"></span><button id="copy">招待リンクをコピー</button><input id="link" type="text" readonly hidden></div>
    <div id="plist"></div>
    <button id="rdy" class="primary" hidden>準備完了</button>
    <button id="go" class="primary"></button>
    <button id="cont" class="primary" hidden>続ける</button>
    <div class="legend" id="plegend">
      <span><i style="background:#ffa62b"></i>通常</span><span><i style="background:#3ec5ff"></i>ジグザグ</span>
      <span><i style="background:#f5e642"></i>放物線</span><span><i style="background:#f2f2f2"></i>クリック</span>
      <span><i style="background:#58e08a"></i>回復</span>
    </div>
    <details id="setd" open>
      <summary>感度・FOV・クロスヘア設定</summary>
      <div class="f">
        <label class="fld">感度の基準ゲーム<select id="preset">
          <option value="0.07">VALORANT</option><option value="0.022">CS2 / Apex Legends</option>
          <option value="0.0066">Overwatch 2</option><option value="0.005555">Fortnite</option></select></label>
        <label class="fld">ゲーム内感度<input id="sens" type="number" step="0.001" min="0.001"></label>
        <label class="fld">DPI<input id="dpi" type="number" step="50" min="100"></label>
      </div>
      <div id="cm"></div>
      <div class="f">
        <label class="fld">水平FOV（16:9基準）<input id="fov" type="number" min="60" max="130"></label>
        <label class="fld">音量<input id="vol" type="range" min="0" max="1" step="0.05"></label>
        <label class="fld">パッド感度<input id="padsens" type="range" min="60" max="600" step="10"></label>
        <label class="fld" style="flex:0">クロスヘア<input id="xhc" type="color"></label>
      </div>
      <div class="f"><label><input id="fs" type="checkbox"> プレイ開始時にフルスクリーンにする（描画の遅延が減ります）</label></div>
    </details>
    <button id="leave">退出</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
'use strict';
/* ================= constants ================= */
const W=22,H=12,ZC=-30,MAXL=5,MAXP=8,DPS=100,PREFIX='outbound-v2-';
const COLORS=['#ffb238','#4cc9f0','#f72585','#b8f35d','#c77dff','#ff7b54','#5eead4','#f5f5f5'];
const TYPES={n:{c:0xffa62b,score:100},z:{c:0x3ec5ff,score:150},s:{c:0xff4d8d,score:150},t:{c:0xa06bff,score:300},h:{c:0x58e08a,score:50},p:{c:0xf5e642,score:150},c:{c:0xf2f2f2,score:80}};
const $=id=>document.getElementById(id);

/* ================= settings ================= */
const cfg={name:'',preset:'0.022',sens:1.5,dpi:800,fov:103,vol:0.5,xh:'#ffffff',fs:true,padsens:240};
try{Object.assign(cfg,JSON.parse(localStorage.getItem('outbound-cfg2')||'{}'))}catch(e){}
if(!cfg.name)cfg.name='Player'+Math.floor(Math.random()*900+100);
function saveCfg(){try{localStorage.setItem('outbound-cfg2',JSON.stringify(cfg))}catch(e){}}

/* ================= state ================= */
const S={phase:'menu',isHost:false,online:false,code:'',myId:null,players:new Map(),targets:new Map(),lives:MAXL,t0:0,offset:0,over:null};
const meshes=new Map(),effects=[],hpDirty=new Set();
let yaw=0,pitch=0,locked=false,session=0,locking=false,engaged=false,paused=false;
let peer=null,hostConn=null;const conns=new Map();
let wave=false,waveDl=null,waveBonus=0.5,tid=0,nextSpawn=0,dirty=false,lastP=0,bestRtt=1e9;
const hostNow=()=>performance.now()+S.offset;

/* ================= three.js scene ================= */
const cv=$('cv');
// bisect switches for stutter hunting: ?noaa  ?nohud  ?nofog
const Q=new URLSearchParams(location.search);
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:!Q.has('noaa')});
if(Q.has('nohud')){const s=document.createElement('style');s.textContent='#hud>*:not(#xh){display:none!important}';document.head.append(s)}
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0a0e1a);if(!Q.has('nofog'))scene.fog=new THREE.Fog(0x0a0e1a,50,120);
const camera=new THREE.PerspectiveCamera(70,1,0.1,200);camera.rotation.order='YXZ';
scene.add(new THREE.HemisphereLight(0xbfd0ff,0x1a1420,0.9));
const sun=new THREE.DirectionalLight(0xffffff,0.8);sun.position.set(4,10,8);scene.add(sun);
if(!Q.has('nogrid')){ // back wall with grid texture
  const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');
  g.fillStyle='#0d1324';g.fillRect(0,0,256,256);g.strokeStyle='#1d2742';g.lineWidth=2;g.strokeRect(0,0,256,256);
  const tx=new THREE.CanvasTexture(c);tx.wrapS=tx.wrapT=THREE.RepeatWrapping;tx.repeat.set(80,40);
  const wall=new THREE.Mesh(new THREE.PlaneGeometry(320,160),new THREE.MeshBasicMaterial({map:tx}));wall.position.z=-60;scene.add(wall);
  const grid=new THREE.GridHelper(160,80,0x2a3760,0x18203a);grid.position.y=-8;scene.add(grid);
}
const frameMat=new THREE.MeshBasicMaterial({color:0x6f9bff,fog:false});
{ // play-field outline: targets leaving through it count as escaped (flashes red on a miss)
  const T=0.12,mk=(w,h,x,y)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),frameMat);m.position.set(x,y,ZC);scene.add(m)};
  mk(2*W+T,T,0,H);mk(2*W+T,T,0,-H);mk(T,2*H+T,-W,0);mk(T,2*H+T,W,0)}
const sphereGeo=new THREE.SphereGeometry(1,28,18),ringGeo=new THREE.RingGeometry(0.82,1,40);
const cBase=new THREE.Color(0x6f9bff),cRed=new THREE.Color(0xff2a3c),cTmp=new THREE.Color();
let frameFlash=-1e9;
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;
  camera.fov=2*Math.atan(Math.tan(cfg.fov*Math.PI/360)*9/16)*180/Math.PI;camera.updateProjectionMatrix()}
addEventListener('resize',resize);

/* ================= targets ================= */
const V={x:0,y:0,z:0};
// KovaaK's-style strafing: sideways speed flips at random moments (mostly reversals, sometimes a brief stop).
// Deterministic from g.sd so host and guests compute the identical path.
const zCache=new WeakMap();
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function zPath(g){let z=zCache.get(g);if(z)return z;
  // each segment: speed ramps linearly v0->v1 over RAMP seconds (a little inertia), then holds v1
  const r=rng(g.sd||1),T=[0],P=[0],V0=[],V1=[],R=[],C=[0];let t=0,p=0,v=0,dir=r()<0.5?-1:1;const LIM=3.2,RAMP=0.15;
  for(let i=0;i<50;i++){
    if(p>LIM)dir=-1;else if(p<-LIM)dir=1;
    const dur=0.3+r()*0.5,v1=r()<0.15?0:dir*g.amp*(0.75+0.25*r()),rp=Math.min(RAMP,dur*0.5);
    V0.push(v);V1.push(v1);R.push(rp);C.push(C[C.length-1]+absInt(v,v1,rp,dur));
    p+=(v+v1)/2*rp+v1*(dur-rp);t+=dur;v=v1;T.push(t);P.push(p);
    if(r()<0.8)dir=-dir}
  z={T,P,V0,V1,R,C};zCache.set(g,z);return z}
// integral of |speed| over u seconds of a segment (speed ramps v0->v1 over rp, then holds v1)
function absInt(v0,v1,rp,u){const ur=Math.min(u,rp);let a;
  if(rp<=0)a=0;else{const v=v0+(v1-v0)*ur/rp;
    if(v0*v>=0)a=Math.abs(v0+v)/2*ur;else{const tz=-v0*rp/(v1-v0);a=Math.abs(v0)*tz/2+Math.abs(v)*(ur-tz)/2}}
  return a+(u>rp?Math.abs(v1)*(u-rp):0)}
// forward progress (as equivalent seconds): the faster it moves sideways, the slower it advances
const ZSLOW=0.5;
function zFwd(g,s){const z=zPath(g),T=z.T,n=T.length-1;let ia;
  if(s>=T[n])ia=z.C[n]+Math.abs(z.V1[n-1])*(s-T[n]);
  else{let i=0;while(T[i+1]<=s)i++;ia=z.C[i]+absInt(z.V0[i],z.V1[i],z.R[i],s-T[i])}
  return s-ZSLOW*ia/g.amp}
function zLat(g,s){const z=zPath(g),T=z.T,n=T.length-1;if(s>=T[n])return z.P[n];
  let i=0;while(T[i+1]<=s)i++;const u=s-T[i],rp=z.R[i],v0=z.V0[i],v1=z.V1[i];
  return z.P[i]+(u<rp?v0*u+(v1-v0)*u*u/(2*rp):(v0+v1)/2*rp+v1*(u-rp))}
function tpos(g,hn,o){const s=Math.max(0,(hn-g.t0)/1000);
  if(g.G){o.x=g.x+g.vx*s;o.y=g.y+g.vy*s-0.5*g.G*s*s;o.z=g.z;return o} // lob: launched, then gravity
  const d=g.sp*(g.amp?zFwd(g,s):s),w=g.amp?zLat(g,s):0;
  o.x=g.x+g.dx*d-g.dy*w;o.y=g.y+g.dy*d+g.dx*w;o.z=g.z;return o}
const arcMat=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.9,side:THREE.DoubleSide,depthTest:false});
const arcRed=new THREE.MeshBasicMaterial({color:0xff3b4e,transparent:true,opacity:0.95,side:THREE.DoubleSide,depthTest:false});
const barGeo=new THREE.PlaneGeometry(2,0.22),fillGeo=new THREE.PlaneGeometry(1.84,0.12).translate(0.92,0,0);
const barBg=new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:0.65,depthTest:false});
const barOk=new THREE.MeshBasicMaterial({color:0xffffff,depthTest:false}),barLow=new THREE.MeshBasicMaterial({color:0xff3b4e,depthTest:false});
function addTarget(g){g.mx=g.mx||g.hp;S.targets.set(g.id,g);const c=TYPES[g.ty].c;
  const m=new THREE.Mesh(sphereGeo,new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:0.4,roughness:0.45}));
  m.userData={base:new THREE.Color(c),flash:-1e9,arc:null,af:-1,bar:null,fill:null};
  if(g.ty!=='c'){ // tracking targets: horizontal HP bar above the target (billboarded, shown once damaged)
    const bar=new THREE.Group(),bg=new THREE.Mesh(barGeo,barBg),fill=new THREE.Mesh(fillGeo,barOk);
    fill.position.set(-0.92,0,0.001);bg.renderOrder=4;fill.renderOrder=5;bar.add(bg,fill);bar.position.y=1.55;bar.visible=false;m.add(bar);
    m.userData.bar=bar;m.userData.fill=fill}
  scene.add(m);meshes.set(g.id,m)}
function updBar(m,g){const u=m.userData;if(!u.bar)return;const f=Math.max(0,Math.min(1,g.hp/g.mx));
  u.bar.visible=f<1&&f>0;if(!u.bar.visible)return;
  u.fill.scale.x=Math.max(0.001,f);u.fill.material=f<0.3?barLow:barOk;u.bar.quaternion.copy(camera.quaternion)}
function removeTarget(id){S.targets.delete(id);const m=meshes.get(id);if(m){if(m.userData.arc)m.userData.arc.geometry.dispose();scene.remove(m);m.material.dispose();meshes.delete(id)}}
// click targets: the ring around the target is the time limit (shrinks as the wave timer runs out, red in the last quarter)
function updArc(m,g,frac){const q=Math.max(0,Math.min(24,Math.round(frac*24))),u=m.userData,key=q+(frac<0.25?100:0);if(key===u.af)return;u.af=key;
  if(u.arc){m.remove(u.arc);u.arc.geometry.dispose();u.arc=null}
  if(q>0){u.arc=new THREE.Mesh(new THREE.RingGeometry(1.2,1.36,40,1,Math.PI/2,q/24*Math.PI*2),frac<0.25?arcRed:arcMat);u.arc.renderOrder=4;m.add(u.arc)}}
function clearTargets(){for(const id of [...S.targets.keys()])removeTarget(id)}
function burst(x,y,z,r,color,dur){const m=new THREE.Mesh(ringGeo,new THREE.MeshBasicMaterial({color,transparent:true,depthWrite:false,side:THREE.DoubleSide}));
  m.position.set(x,y,z);scene.add(m);effects.push({m,t:performance.now(),dur,r,kind:'ring'})}
function dirFrom(y,p,o){const cp=Math.cos(p);o.x=-Math.sin(y)*cp;o.y=Math.sin(p);o.z=-Math.cos(y)*cp;return o}
/* ================= audio ================= */
let ac=null;
function snd(k,pan){if(!ac||cfg.vol<=0)return;const P={spawn:[330,560,.1,.3,'triangle'],trk:[430,470,.05,.1,'sine'],hit:[900,1300,.06,.35,'sine'],kill:[700,1800,.11,.45,'triangle'],hurt:[170,55,.4,.7,'sawtooth'],heal:[520,1040,.25,.4,'sine']}[k];
  const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type=P[4];o.frequency.setValueAtTime(P[0],t);o.frequency.exponentialRampToValueAtTime(P[1],t+P[2]);
  g.gain.setValueAtTime(P[3]*cfg.vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+P[2]);o.connect(g);
  if(pan!==undefined&&ac.createStereoPanner){const sp=ac.createStereoPanner();sp.pan.value=Math.max(-1,Math.min(1,pan));g.connect(sp).connect(ac.destination)}else g.connect(ac.destination);
  o.start(t);o.stop(t+P[2]+0.02)}
function initAudio(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}else if(ac.state==='suspended')ac.resume()}

/* ================= networking ================= */
function rawBroadcast(m,except){for(const [id,c] of conns)if(id!==except&&c.open)c.send(m)}
function emit(m){apply(m);rawBroadcast(m)}                       // host: apply locally + send to everyone
function send(m){if(S.isHost)hostHandle(S.myId,m);else if(hostConn&&hostConn.open)hostConn.send(m)}
const plist=()=>[...S.players.values()].map(p=>({id:p.id,name:p.name,ci:p.ci,kills:p.kills,shots:p.shots,hits:p.hits,score:p.score,rd:p.rd?1:0}));
function emitPlayers(){dirty=false;lastP=performance.now();emit({t:'players',list:plist()})}
function newPlayer(id,name){const used=new Set([...S.players.values()].map(p=>p.ci));let ci=0;while(used.has(ci))ci++;
  name=String(name||'Player').replace(/[\u0000-\u001f]/g,'').slice(0,12)||'Player';
  return {id,name,ci,kills:0,shots:0,hits:0,score:0,rd:0,y:0,p:0,ty:0,tp:0,f:0}}
function genCode(){const a='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<5;i++)s+=a[Math.floor(Math.random()*a.length)];return s}

function createRoom(tries){
  const my=++session,code=genCode();$('msg').textContent='ルームを作成中…';
  S.isHost=true;S.offset=0;S.myId='host';let entered=false;
  const enter=online=>{if(entered||my!==session)return;entered=true;S.code=code;S.online=online;S.players=new Map();
    S.players.set('host',newPlayer('host',cfg.name));S.phase='lobby';S.lives=MAXL;S.over=null;$('msg').textContent='';
    if(!online)toast('シグナリングサーバーに繋がらないため、ソロ専用で起動しました');refreshUI()};
  if(typeof Peer==='undefined'){enter(false);return}
  let p;try{p=new Peer(PREFIX+code,{debug:1})}catch(e){enter(false);return}
  peer=p;
  p.on('open',()=>enter(true));
  p.on('error',e=>{if(my!==session)return;if(e.type==='unavailable-id'&&!entered&&(tries||0)<3){p.destroy();createRoom((tries||0)+1);return}enter(false)});
  p.on('disconnected',()=>{if(my===session&&!p.destroyed)try{p.reconnect()}catch(e){}});
  p.on('connection',c=>{
    c.on('open',()=>{if(my!==session)return;if(conns.size+1>=MAXP){c.send({t:'full'});setTimeout(()=>c.close(),400);return}conns.set(c.peer,c)});
    c.on('data',m=>{if(my===session&&conns.get(c.peer)===c)hostHandle(c.peer,m)});
    c.on('close',()=>{if(my===session)dropPeer(c.peer,c)});
    c.on('error',()=>{if(my===session)dropPeer(c.peer,c)});
  });
}
function dropPeer(id,c){if(conns.get(id)!==c)return;conns.delete(id);const p=S.players.get(id);if(p){removeRing(p);S.players.delete(id);emitPlayers();checkReady()}}

function joinRoom(code){
  if(typeof Peer==='undefined'){$('msg').textContent='通信ライブラリを読み込めませんでした';return}
  const my=++session;$('msg').textContent='接続中…';S.isHost=false;S.online=true;bestRtt=1e9;
  const p=new Peer(undefined,{debug:1});peer=p;
  p.on('open',()=>{if(my!==session)return;
    const c=p.connect(PREFIX+code,{reliable:true,serialization:'json'});hostConn=c;
    const to=setTimeout(()=>{if(my===session&&!c.open)leave('接続がタイムアウトしました。ネットワーク環境によっては直接接続できない場合があります')},12000);
    c.on('open',()=>{clearTimeout(to);if(my!==session)return;S.code=code;c.send({t:'hello',name:cfg.name});
      let n=0;const f=()=>{if(my!==session||!c.open)return;c.send({t:'ping',c:performance.now()});setTimeout(f,++n<6?250:10000)};f()});
    c.on('data',m=>{if(my===session)apply(m)});
    c.on('close',()=>{if(my===session)leave('ホストとの接続が切れました')});
  });
  p.on('error',e=>{if(my===session)leave(e.type==='peer-unavailable'?'ルームが見つかりません':'接続エラー: '+e.type)});
}
function leave(msg){session++;padOn=false;try{peer&&peer.destroy()}catch(e){}peer=null;hostConn=null;conns.clear();
  for(const p of S.players.values())removeRing(p);S.players=new Map();clearTargets();S.phase='menu';S.over=null;
  if(document.pointerLockElement)document.exitPointerLock();$('msg').textContent=msg||'';refreshUI()}

/* ---- host: messages from players (including the host itself) ---- */
function hostHandle(id,m){
  if(!m||typeof m!=='object')return;
  switch(m.t){
    case 'hello':{if(S.players.has(id))return;const c=conns.get(id);if(!c)return;S.players.set(id,newPlayer(id,m.name));
      c.send({t:'welcome',id,phase:S.phase,t0:S.t0,lives:S.lives,targets:[...S.targets.values()],over:S.over});emitPlayers();break}
    case 'ping':{const c=conns.get(id);if(c)c.send({t:'pong',c:m.c,h:performance.now()});break}
    case 'ready':if(S.players.has(id)){readySet.add(id);checkReady()}break;
    case 'lready':{const p=S.players.get(id);if(p&&S.phase==='lobby'){p.rd=m.v?1:0;emitPlayers()}break}
    case 'click':if(S.players.has(id))hostClick(id,typeof m.h==='number'?m.h:null);break;
    case 'aim':{const p=S.players.get(id);if(p&&id!==S.myId){p.ty=+m.y||0;p.tp=+m.p||0;p.f=m.f?1:0;
      if(m.f&&S.phase==='playing')hostBeam(id,typeof m.h==='number'?m.h:null,Math.min(0.15,Math.max(0,+m.dt||0.05)))}break}
  }
}
/* ---- host: simulation ---- */
const SPAWN_DELAY=0.3;
const readySet=new Set(); // host: players who pressed "continue" on the result screen
let myReady=false,rdy={n:0,of:0};
function checkReady(){if(S.phase!=='over'||!S.isHost)return;
  for(const id of [...readySet])if(!S.players.has(id))readySet.delete(id);
  const n=readySet.size,of=S.players.size;
  if(n>=of){readySet.clear();for(const p of S.players.values())p.rd=0;emit({t:'lobby'});emitPlayers()}else emit({t:'ready',n,of})}
const pendingC=[]; // click-wave targets waiting for their 0.15s-staggered spawn time (host) // seconds before a freed slot gets a new target
function hostBeam(id,hid,dt){
  const p=S.players.get(id);if(!p||S.phase!=='playing')return;p.shots++;dirty=true;
  const g=hid!=null?S.targets.get(hid):null;if(!g||g.ty==='c')return; // click targets ignore the held beam
  p.hits++;g.hp-=DPS*dt;hpDirty.add(g.id);
  if(g.hp<=0){p.kills++;p.score+=TYPES[g.ty].score;if(g.ty==='h'&&S.lives<MAXL)S.lives++;hpDirty.delete(g.id);emit({t:'kill',id:g.id,by:id,lives:S.lives})}
}
// a single mouse press: pops a click target under the crosshair (one shot, no hold)
function hostClick(id,hid){const p=S.players.get(id);if(!p||S.phase!=='playing')return;p.shots++;dirty=true;
  const g=hid!=null?S.targets.get(hid):null;if(!g||g.ty!=='c')return;
  p.hits++;p.kills++;p.score+=TYPES.c.score;
  let dl=0;if(waveDl!=null){waveDl+=waveBonus;dl=S.t0+waveDl*1000}
  emit({t:'kill',id:g.id,by:id,lives:S.lives,dl})}
function doClick(){if(S.phase!=='playing'||hostNow()<S.t0)return;const h=pick();
  if(S.isHost)hostClick('host',h);else if(hostConn&&hostConn.open)hostConn.send({t:'click',h})}
// targets enter from just outside one screen edge, cross the field, and leave past the opposite edge
function spawn(gs,n){
  // big targets at the start, shrinking as the run goes on
  let r=Math.max(0.6,1.206-0.00505*gs),sp=Math.min(24,gs<150?7+0.07*gs:17.5+0.02*(gs-150))*(0.8+Math.random()*0.4),ty='n',hp=60,amp=0,fq=0;
  const pz=gs>20?Math.min(0.25,(gs-20)*0.006):0,ph=(gs>15&&S.lives<MAXL)?0.05:0,pp=gs>8?Math.min(0.25,(gs-8)*0.01):0,pc=(!wave&&gs>10)?Math.min(0.18,(gs-10)*0.006):0;
  const u=Math.random();
  if(u<ph){ty='h';r*=0.85;sp*=1.1;hp=40}
  else if(u>=1-pp){ty='p';hp=70}
  else if(u>=1-pp-pc){ty='c';hp=1}
  else if(u<ph+pz){ty='z';sp*=0.5;amp=sp*0.6;hp=80}
  if(ty==='n')sp*=1.75;
  const m=r+1.5,sg=Math.random()<0.5?-1:1,rnd=()=>Math.random()*2-1;let x,y,tx,tyy;
  if(ty==='c'){ // click wave: 3..12 stationary targets, one every 0.3s; one shared time limit, one life lost if any are left when it ends
    const N=Math.min(12,3+Math.floor(gs/12)),rr=r,pos=[],tl=Math.max(1.7,3.6-gs*1.9/110)/2;
    for(let k=0,tries=0;k<N&&tries<400;tries++){const px=rnd()*W*0.8,py=rnd()*H*0.75;
      if(pos.every(q=>Math.hypot(q[0]-px,q[1]-py)>rr*2.4)){pos.push([px,py]);k++}}
    const dl=gs+(pos.length-1)*0.3+tl; // one shared deadline: tl seconds after the last target appears
    waveDl=dl;waveBonus=Math.max(0.2,0.5-gs*0.3/110); // each pop adds waveBonus seconds (smaller at higher levels)
    pos.forEach((q,i)=>pendingC.push({at:gs+i*0.3,x:q[0],y:q[1],r:rr,hp,ws:dl-gs,wn:pos.length,wi:i}));wave=true;return}
  if(ty==='p'){ // launched from below the bottom edge, arcs up toward one side, then falls back out the bottom
    const y0=-(H+m),apex=H*(0.1+0.6*Math.random()),ttk=hp/DPS,G=Math.min(sp*1.6,8*(apex+H)/(ttk*ttk)), // airtime above the bottom edge >= kill time
vy=Math.sqrt(2*G*(apex-y0)),T=2*vy/G;
    const x0=rnd()*W*0.6,dir=Math.random()<0.5?-1:1,room=Math.max(2,W*0.92-dir*x0),vx=dir*room*(0.5+0.5*Math.random())/T;
    emit({t:'spawn',g:{id:++tid,ty,x:x0,y:y0,z:ZC+(Math.random()-0.5)*3,dx:0,dy:-1,sp:0,r,hp,mx:hp,amp:0,fq:0,vx,vy,G,t0:S.t0+gs*1000}});return}
  const rndC=()=>(rnd()+rnd())/2; // triangular: heights near the top/bottom are rarer than near the middle
  // exit point leans toward the opposite side of the entry point, so the path crosses near the middle and never clips a corner
  const kY=ty==='z'?0.65:0.85,aim=()=>0.2+0.6*Math.random(),cl=(v,l)=>Math.max(-l,Math.min(l,v));
  if(ty!=='z'){x=sg*(W+m);tx=-x;y=rndC()*H*kY;tyy=cl(-y*aim()+rnd()*H*0.15,H*kY)}
  else{y=sg*(H+m);tyy=-y;x=rnd()*W*0.7;tx=cl(-x*aim()+rnd()*W*0.15,W*0.7)} // zigzag: top/bottom only, strafes sideways toward the far wall
  let dx=tx-x,dy=tyy-y;const l=Math.hypot(dx,dy);dx/=l;dy/=l;
  // speed cap: crossing the field must take at least as long as the kill time (hp/DPS), so a perfect beam could always finish it
  {const sp0=sp;sp=Math.min(sp,l*0.9*DPS/hp);if(amp)amp*=sp/sp0}
  emit({t:'spawn',g:{id:++tid,ty,x,y,z:ZC+(Math.random()-0.5)*3,dx,dy,sp,r,hp,mx:hp,amp,fq,sd:Math.floor(Math.random()*2147483647)+1,t0:S.t0+gs*1000}});
}
function hostStart(){for(const p of S.players.values()){p.kills=p.shots=p.hits=p.score=0;p.f=0;p.rd=0}hpDirty.clear();nextSpawn=null;wave=false;waveDl=null;pendingC.length=0;
  emit({t:'start',t0:performance.now()+4000});emitPlayers()}
function hostTick(){
  if(S.phase!=='playing')return;const hn=hostNow(),gt=(hn-S.t0)/1000;if(gt<0)return;
  for(const g of [...S.targets.values()]){tpos(g,hn,V);
    if(g.ty==='c')continue;
    if(Math.abs(V.x)<W&&Math.abs(V.y)<H)g.in=true;
    else if(g.in||hn-g.t0>25000){const cost=!!g.in&&g.ty!=='h';if(cost)S.lives--;
      emit({t:'esc',id:g.id,cost,lives:S.lives,x:Math.max(-W,Math.min(W,V.x)),y:Math.max(-H,Math.min(H,V.y))});
      if(S.lives<=0){emit({t:'over',time:gt,list:plist()});return}}}
  while(pendingC.length&&pendingC[0].at<=gt){const c=pendingC.shift(),t0=S.t0+gt*1000;
    emit({t:'spawn',g:{id:++tid,ty:'c',x:c.x,y:c.y,z:ZC+(Math.random()-0.5)*2,dx:0,dy:0,sp:0,r:c.r,hp:c.hp,mx:c.hp,amp:0,fq:0,wn:c.wn,wi:c.wi,dl:S.t0+waveDl*1000,ws:c.ws*1000,t0}})}
  if(waveDl!=null){const left=[...S.targets.values()].filter(g=>g.ty==='c');
    if(!pendingC.length&&!left.length)waveDl=null;
    else if(gt>=waveDl){S.lives--;waveDl=null;pendingC.length=0;
      left.forEach((g,i)=>emit({t:'esc',id:g.id,cost:i===0,lives:S.lives,x:g.x,y:g.y}));
      if(S.lives<=0){emit({t:'over',time:gt,list:plist()});return}}}
  wave=pendingC.length>0||[...S.targets.values()].some(g=>g.ty==='c');
  // at most one target per player on screen; when one is killed/escapes, a replacement follows after a short beat
  const n=S.players.size;
  if(S.targets.size<n){if(nextSpawn==null)nextSpawn=gt+SPAWN_DELAY;if(gt>=nextSpawn){spawn(gt,n);nextSpawn=null}}else nextSpawn=null;
}
let lastBeam=performance.now(),tickN=0;
setInterval(()=>{
  if(S.phase==='menu')return;
  const now=performance.now(),dt=Math.min(0.15,Math.max(0.01,(now-lastBeam)/1000));lastBeam=now;
  const f=((firing&&locked)||(padFire&&padOn&&!paused))&&S.phase==='playing'&&hostNow()>=S.t0,h=f?pick():null;
  $('hm').style.opacity=h!=null?'.85':'';
  if(h!=null&&(++tickN&1))snd('trk');
  if(S.isHost){
    const me=S.players.get('host');if(me)me.f=f?1:0;
    if(f)hostBeam('host',h,dt);
    hostTick();
    if(conns.size){const a={};for(const p of S.players.values())a[p.id]=[r3(p.id===S.myId?yaw:p.ty),r3(p.id===S.myId?pitch:p.tp),p.f?1:0];rawBroadcast({t:'aims',a})}
    if(hpDirty.size){const a={};for(const id of hpDirty){const g=S.targets.get(id);if(g)a[id]=Math.round(Math.max(0,g.hp)*10)/10}hpDirty.clear();emit({t:'hps',a})}
    if(dirty&&now-lastP>300)emitPlayers();
  }else if(hostConn&&hostConn.open&&S.phase==='playing')hostConn.send({t:'aim',y:r3(yaw),p:r3(pitch),f:f?1:0,h,dt:r3(dt)});
},50);
const r3=v=>Math.round(v*1000)/1000;

/* ---- everyone: apply events from the host ---- */
function setPlayers(list){const old=S.players,nm=new Map();
  for(const d of list){const o=old.get(d.id)||{y:0,p:0,ty:0,tp:0};nm.set(d.id,Object.assign(o,d))}
  for(const [id,o] of old)if(!nm.has(id))removeRing(o);S.players=nm}
function removeRing(p){if(p.ring){scene.remove(p.ring);p.ring.material.dispose();p.ring=null}if(p.beam){scene.remove(p.beam);p.beam.geometry.dispose();p.beam.material.dispose();p.beam=null}}
function apply(m){
  if(!m||typeof m!=='object')return;
  switch(m.t){
    case 'welcome':S.myId=m.id;S.phase=m.phase;S.t0=m.t0;S.lives=m.lives;S.over=m.over;clearTargets();m.targets.forEach(addTarget);$('msg').textContent='';refreshUI();break;
    case 'players':setPlayers(m.list);renderBoards();break;
    case 'pong':{const now=performance.now(),rtt=now-m.c;if(rtt<bestRtt){bestRtt=rtt;S.offset=m.h+rtt/2-now}break}
    case 'start':engaged=false;paused=false;padOn=false;lastTier=-1;S.phase='playing';S.t0=m.t0;S.lives=MAXL;S.over=null;clearTargets();refreshUI();break;
    case 'spawn':if(S.phase==='playing'){addTarget(m.g);snd('spawn',m.g.x/W)}break;
    case 'hps':{const now=performance.now();for(const id in m.a){const g=S.targets.get(+id),ms=meshes.get(+id);if(g)g.hp=m.a[id];if(ms)ms.userData.flash=now}break}
    case 'kill':{const g=S.targets.get(m.id);if(g){tpos(g,hostNow(),V);const pl=S.players.get(m.by);
        burst(V.x,V.y,V.z,g.r,pl?COLORS[pl.ci]:'#ffffff',260);if(g.ty==='h')snd('heal')}
      if(m.by===S.myId){snd('kill');const h=$('hm');h.classList.remove('go');void h.offsetWidth;h.classList.add('go')}
      if(m.dl)for(const q of S.targets.values())if(q.ty==='c')q.dl=m.dl;
      removeTarget(m.id);S.lives=m.lives;renderLives();break}
    case 'esc':{removeTarget(m.id);if(m.cost){S.lives=m.lives;renderLives();burst(m.x,m.y,ZC,0.9,'#ff2a3c',450);frameFlash=performance.now();
        const h=$('hurt');h.classList.remove('go');void h.offsetWidth;h.classList.add('go');snd('hurt')}break}
    case 'over':S.phase='over';S.over={time:m.time,list:m.list};myReady=false;rdy={n:0,of:S.players.size};if(S.isHost)readySet.clear();
      clearTargets();if(document.pointerLockElement)document.exitPointerLock();refreshUI();break;
    case 'ready':rdy={n:m.n,of:m.of};refreshUI();break;
    case 'lobby':S.phase='lobby';S.over=null;myReady=false;refreshUI();break;
    case 'aims':for(const id in m.a){if(id===S.myId)continue;const p=S.players.get(id);if(p){p.ty=m.a[id][0];p.tp=m.a[id][1];p.f=m.a[id][2]}}break;
    case 'full':leave('ルームが満員です（最大'+MAXP+'人）');break;
  }
}

/* ================= input ================= */
function lock(){initAudio();if(document.pointerLockElement===cv)return;locking=true;setTimeout(()=>{locking=false;refreshUI()},1200);
  const go=()=>{if(Q.has('noraw')){try{cv.requestPointerLock()}catch(e){}return}
    try{const r=cv.requestPointerLock({unadjustedMovement:true});if(r&&r.catch)r.catch(()=>{try{cv.requestPointerLock()}catch(e){}})}catch(e){try{cv.requestPointerLock()}catch(e2){}}};
  // fullscreen lets the browser present directly instead of going through the desktop compositor (less buffering, esp. with mixed-refresh multi-monitor)
  if(cfg.fs&&!document.fullscreenElement&&document.documentElement.requestFullscreen){
    document.documentElement.requestFullscreen({navigationUI:'hide'}).then(go,go)}else go()}
// Esc (pointer lock released mid-game) opens the settings panel; a new round closes it for everyone
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===cv;if(locked){engaged=true;locking=false;paused=false}else{firing=false;if(S.phase==='playing')paused=true}refreshUI()});
cv.addEventListener('click',()=>{if(S.phase==='playing'&&!locked&&!paused)lock()});
// pointerrawupdate delivers each mouse report immediately; mousemove is batched to one per frame, which felt laggy on fast flicks.
// ?nopru falls back to mousemove; ?noraw = pointer lock without unadjustedMovement
const MOVE_EV=(!Q.has('nopru')&&('onpointerrawupdate' in window))?'pointerrawupdate':'mousemove';
document.addEventListener(MOVE_EV,e=>{if(!locked)return;const k=cfg.sens*parseFloat(cfg.preset)*Math.PI/180;
  yaw-=e.movementX*k;pitch=Math.max(-1.48,Math.min(1.48,pitch-e.movementY*k))});
let firing=false;
document.addEventListener('mousedown',e=>{if(locked&&e.button===0){firing=true;doClick()}});
document.addEventListener('mouseup',e=>{if(e.button===0)firing=false});
addEventListener('blur',()=>{firing=false});
const D={};
function pick(){
  if(S.phase!=='playing')return null;const hn=hostNow();if(hn<S.t0)return null;
  dirFrom(yaw,pitch,D);let best=null,bb=1e9;
  for(const g of S.targets.values()){tpos(g,hn,V);const b=V.x*D.x+V.y*D.y+V.z*D.z;if(b<=0)continue;
    const d2=V.x*V.x+V.y*V.y+V.z*V.z-b*b;if(d2<=g.r*g.r&&b<bb){bb=b;best=g}}
  return best?best.id:null}

/* ================= gamepad ================= */
// Standard-mapping pad: right stick = aim, RT/LT/RB/LB = fire (one press = one click), A = confirm / resume, Start or B = pause (settings)
let padOn=false,padFire=false,padPrev={};
function getPad(){let best=null;for(const g of (navigator.getGamepads?navigator.getGamepads():[])){if(!g||!g.connected)continue;if(g.mapping==='standard')return g;if(!best&&g.axes.length>=4)best=g}return best}
function padUpdate(dt){
  const g=getPad();if(!g){padFire=false;return}
  const st={},e={};for(const i of [0,1,4,5,6,7,9]){const b=g.buttons[i];st[i]=!!(b&&(b.pressed||b.value>0.5));e[i]=st[i]&&!padPrev[i]}padPrev=st;
  const anyE=Object.values(e).some(Boolean);
  if(S.phase==='menu'){padFire=false;return}
  if(!$('panel').hidden){ // a panel is open: A presses its main button
    padFire=false;
    if(e[0]){if(S.phase==='playing'){paused=false;padOn=true;refreshUI()}
      else for(const id of ['cont','rdy','go']){const b=$(id);if(!b.hidden&&!b.disabled){b.click();break}}}
    return}
  if(S.phase!=='playing'){padFire=false;return}
  if(!padOn&&!locked){padFire=false;if(anyE){padOn=true;refreshUI()}return}
  if(padOn&&!locked&&(e[9]||e[1])){padOn=true;paused=true;padFire=false;refreshUI();return}
  // aim: radial deadzone, squared response, degrees/second from the settings
  let x=g.axes[2]||0,y=g.axes[3]||0;const m=Math.hypot(x,y),DZ=0.15;
  if(m>DZ){const k=Math.pow((m-DZ)/(1-DZ),2)/m,sp=cfg.padsens*Math.PI/180;x*=k;y*=k;
    yaw-=x*sp*dt;pitch=Math.max(-1.48,Math.min(1.48,pitch-y*sp*dt))}
  padFire=st[7]||st[6]||st[5]||st[4];
  if(e[7]||e[6]||e[5]||e[4])doClick()}

function fmtT(s){s=Math.max(0,s);const m=Math.floor(s/60);return m+':'+(s-m*60).toFixed(1).padStart(4,'0')}

  const d=document.createElement('span');d.className='dot';d.style.background=COLORS[p.ci];
  const n=document.createElement('span');n.className='nm';n.textContent=p.name+(p.id===S.myId?'（自分）':'')+(p.id==='host'?' ★':'');
  const a=document.createElement('span');a.className='ac';a.textContent=p.shots?Math.round(p.hits/p.shots*100)+'%':'–';
  const k=document.createElement('span');k.className='k';k.textContent=p.kills;r.append(d,n,a,k);el.append(r)}}
// result / lobby ranking: ordered by score (accuracy-scaled), with rank tier, accuracy and ready marks in the lobby
function rankRows(el,list){el.textContent='';list.forEach((p,i)=>{const r=document.createElement('div');r.className='rrow';
  const mk=(c,t)=>{const s=document.createElement('span');s.className=c;s.textContent=t;return s};
  const ti=tierOf(adjScore(p)),t=TIERS[ti],tr=document.createElement('span');tr.className='tr';
  tr.innerHTML=tierSvg(ti,22)+t.n;
  const d=mk('dot','');d.style.background=COLORS[p.ci];
  const nm=mk('nm',p.name+(p.id===S.myId?'（自分）':'')+(p.id==='host'?' ★':''));
  if(S.phase==='lobby'&&p.id!=='host'){nm.append(' ');nm.append(mk('ok',p.rd?'✓ 準備完了':''))}
  r.append(mk('pos',i+1),d,nm,tr,mk('ac',p.shots?Math.round(p.hits/p.shots*100)+'%':'–'),mk('k',adjScore(p).toLocaleString()));el.append(r)})}
function renderBoards(){const list=(S.phase==='over'&&S.over?S.over.list:[...S.players.values()]).slice().sort((a,b)=>b.kills-a.kills);
  boardRows($('board'),list);rankRows($('plist'),list.slice().sort((a,b)=>adjScore(b)-adjScore(a)));

// 10 ranks (thresholds are on your own accuracy-scaled score); the gauge shows 5 at a time and scrolls right as you climb
const TIERS=[{n:'Bronze',c:'#e07a1f',t:0},{n:'Silver',c:'#aeb9c9',t:400},{n:'Gold',c:'#e3b948',t:1000},{n:'Platinum',c:'#5fd6c4',t:1900},
  {n:'Diamond',c:'#6aa6ff',t:3000},{n:'Jade',c:'#2fbf71',t:4400},{n:'Master',c:'#c77dff',t:6200},{n:'Grandmaster',c:'#ff7b9c',t:8400},{n:'Champion',c:'#ff5a3c',t:11000},{n:'Apex',c:'#ffffff',t:14000}];
// rank icons: the first tier is the plain hexagon; each tier above adds one more element (inner ring, bolt, wings, crown, chevron, 2nd ring, studs, big wings, glow)
let _gid=0;
function shade(hex,k){const n=parseInt(hex.slice(1),16),f=k>0?v=>Math.round(v+(255-v)*k):v=>Math.round(v*(1+k));
  return '#'+[n>>16,(n>>8)&255,n&255].map(v=>f(v).toString(16).padStart(2,'0')).join('')}
// Row 1 (Bronze..Diamond): beveled hexagon that gains parts each tier. Row 2 (Jade..Apex): one unique emblem each.
function tierSvg(i,h){
  const c=TIERS[i].c,id='tg'+(++_gid),hi=shade(c,.5),lo=shade(c,-.5),dk='#0a0e1a',G='url(#'+id+')';
  const P=a=>a.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const hex=(cx,cy,r)=>P([0,1,2,3,4,5].map(k=>{const a=(-90+60*k)*Math.PI/180;return [cx+r*Math.cos(a),cy+r*Math.sin(a)]}));
  const star=(cx,cy,R,r,n)=>P(Array.from({length:n*2},(_,k)=>{const a=(-90+180*k/n)*Math.PI/180,q=k%2?r:R;return [cx+q*Math.cos(a),cy+q*Math.sin(a)]}));
  const poly=(pts,f,st)=>'<polygon points="'+(typeof pts==='string'?pts:P(pts))+'" fill="'+f+'"'+(st?' stroke="'+lo+'" stroke-width="1.5" stroke-linejoin="round"':'')+'/>';
  const mir=pts=>pts.map(p=>[64-p[0],p[1]]);
  let s='<svg viewBox="0 0 64 64" width="'+h+'" height="'+h+'" style="vertical-align:middle;flex:none"><defs>'+(i===9
    ? '<linearGradient id="'+id+'" x1="0" y1="0" x2="1" y2="1">'+['#ff5a6e','#ffb347','#fff36b','#5af08a','#5ad8ff','#6a7bff','#c77dff'].map((q,k)=>'<stop offset="'+(k/6).toFixed(2)+'" stop-color="'+q+'"/>').join('')+'</linearGradient>'
    : '<linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+hi+'"/><stop offset=".5" stop-color="'+c+'"/><stop offset="1" stop-color="'+lo+'"/></linearGradient>')+'</defs>';
  if(i<=4){
    if(i>=2){const w=[[11,24],[1,34],[11,44]];s+=poly(w,G,1)+poly(mir(w),G,1)}
    if(i>=3)s+=poly([[32,2],[26,13],[38,13]],G,1);
    if(i>=4)s+='<circle cx="32" cy="34" r="29.5" fill="none" stroke="'+c+'" stroke-width="1.2" opacity=".5"/>';
    s+=poly(hex(32,34,22),G,1)+poly(hex(32,34,16),'rgba(0,0,0,.25)');
    if(i>=1&&i<4)s+=poly([[34,22],[25,35],[31,35],[29,47],[39,31],[33,31]],hi);
    if(i>=3)s+='<polyline points="'+P([[24,47],[32,52],[40,47]])+'" fill="none" stroke="'+hi+'" stroke-width="2" stroke-linejoin="round"/>';
    if(i>=4){s+=poly([[32,22],[43,34],[32,48],[21,34]],hi)+'<path d="M21 34H43M32 22L28 34L32 48L36 34Z" fill="none" stroke="'+c+'" stroke-width="1"/>';
      s+=hex(32,34,22).split(' ').map(p=>{const q=p.split(',');return '<circle cx="'+q[0]+'" cy="'+q[1]+'" r="1.8" fill="#fff"/>'}).join('')}
  }else if(i===5){ // Jade: hexagonal jade tablet carved with nested hexagons, hung from a bail with a tassel
    s+='<rect x="28" y="1" width="8" height="8" rx="3" fill="'+c+'" stroke="'+lo+'" stroke-width="1.2"/>';
    s+=poly(hex(32,31,24),G,1)+'<polygon points="'+hex(32,31,19.5)+'" fill="none" stroke="'+hi+'" stroke-width="1.3" opacity=".7"/>';
    s+='<polygon points="'+hex(32,31,15)+'" fill="rgba(0,0,0,.22)" stroke="'+hi+'" stroke-width="1" opacity=".9"/>';
    for(let k=0;k<6;k++){const a=(-90+60*k)*Math.PI/180;s+='<line x1="'+(32+15*Math.cos(a)).toFixed(1)+'" y1="'+(31+15*Math.sin(a)).toFixed(1)+'" x2="'+(32+24*Math.cos(a)).toFixed(1)+'" y2="'+(31+24*Math.sin(a)).toFixed(1)+'" stroke="'+hi+'" stroke-width="1.2" opacity=".55"/>'}
    s+=poly(hex(32,31,8.5),dk,1)+'<polygon points="'+hex(32,31,8.5)+'" fill="none" stroke="'+hi+'" stroke-width="1.2" opacity=".8"/>';
    s+='<path d="M32 55V59" stroke="'+c+'" stroke-width="2.4"/><polygon points="'+P([[32,58],[36,61],[32,64],[28,61]])+'" fill="'+G+'" stroke="'+lo+'" stroke-width="1"/>';
  }else if(i===6||i===7){ // Master / Grandmaster share one shield-and-star design; Grandmaster adds wings and a crown
    const sh='M32 3L56 11V32C56 46 46 56 32 62C18 56 8 46 8 32V11Z',gm=i===7,
      T=gm?'translate(32 38) scale(.72) translate(-32 -33)':'translate(32 32.5) scale(1) translate(-32 -32.5)';
    if(gm)for(let k=0;k<3;k++){const f=[[16,26+k*6],[1+k*2,20+k*7],[16,32+k*6]];s+=poly(f,G,1)+poly(mir(f),G,1)}
    s+='<g transform="'+T+'"><path d="'+sh+'" fill="'+G+'" stroke="'+lo+'" stroke-width="'+(gm?2.4:1.8)+'" stroke-linejoin="round"/><path d="'+sh+'" transform="translate(32 33) scale(.8) translate(-32 -33)" fill="rgba(0,0,0,.28)"/>'+poly(hex(32,32,17),'rgba(0,0,0,.3)')+'<polygon points="'+hex(32,32,17)+'" fill="none" stroke="'+hi+'" stroke-width="1.4" opacity=".8"/>'+poly(star(32,32,14,6,5),'#fff')+'</g>';
    if(gm){s+=poly([[22,17],[22,8],[27,13],[32,4],[37,13],[42,8],[42,17]],G,1)+'<rect x="22" y="17" width="20" height="3" fill="'+lo+'"/>'+[[32,4],[22,8],[42,8]].map(p=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="2" fill="#fff"/>').join('')}

  }else if(i===8){ // Champion: hexagon frame holding a flame, laurel inside the frame, banner across the bottom
    s+=poly(hex(32,30,24),G,1)+poly(hex(32,30,18.5),'rgba(0,0,0,.3)')+'<polygon points="'+hex(32,30,18.5)+'" fill="none" stroke="'+hi+'" stroke-width="1.3" opacity=".8"/>';
    for(let side=0;side<2;side++)for(let k=0;k<6;k++){const deg=118+k*16,th=deg*Math.PI/180,x=32+14.5*Math.cos(th),y=30+14.5*Math.sin(th),cx=side?64-x:x,rot=side?-(deg+90):deg+90;
      s+='<ellipse cx="'+cx.toFixed(1)+'" cy="'+y.toFixed(1)+'" rx="4.8" ry="2.2" transform="rotate('+rot.toFixed(0)+' '+cx.toFixed(1)+' '+y.toFixed(1)+')" fill="'+hi+'" opacity=".9"/>'}
    s+='<g transform="translate(32 30) scale(.8) translate(-32 -28)"><path d="M32 12C39 21 43 27 39 37C37 43 27 43 25 37C22 29 28 25 32 12Z" fill="'+G+'" stroke="'+lo+'" stroke-width="2"/><path d="M32 24C35 29 36 33 34 37C33 40 30 40 29 37C28 33 30 30 32 24Z" fill="#fff" opacity=".85"/></g>';
    s+=poly([[9,50],[55,50],[50,56],[55,62],[9,62],[14,56]],G,1);
  }else{ // Apex: radiant sunburst around an eye
    s+=poly(star(32,32,31,20,16),G,1)+poly(star(32,32,23,16,8),'rgba(255,255,255,.22)')+'<polygon points="'+hex(32,32,15)+'" fill="'+dk+'" stroke="'+hi+'" stroke-width="1.6"/>';
    s+=poly([[32,21],[41,32],[32,43],[23,32]],G,1)+'<circle cx="32" cy="32" r="3.4" fill="#fff"/>';
    s+=[[5,5],[59,5],[5,59],[59,59]].map(p=>'<polygon points="'+P([[p[0],p[1]-3],[p[0]+3,p[1]],[p[0],p[1]+3],[p[0]-3,p[1]]])+'" fill="'+hi+'"/>').join('');
  }
  return s+'</svg>'}
const tierOf=s=>{let k=0;for(let i=0;i<TIERS.length;i++)if(s>=TIERS[i].t)k=i;return k};
let lastTier=-1;
function renderRank(){
  const el=$('rank');el.hidden=S.phase!=='playing';if(el.hidden)return;
  const me=S.players.get(S.myId);if(!me)return;
  const sc=adjScore(me),cur=tierOf(sc),T=TIERS[cur],start=Math.max(0,Math.min(TIERS.length-5,cur-1));
  const list=[...S.players.values()].sort((a,b)=>adjScore(b)-adjScore(a)),pos=list.findIndex(p=>p.id===S.myId)+1;
  $('rk-ic').innerHTML=tierSvg(cur,40);$('rk-nm').textContent=T.n.toUpperCase();$('rk-nm').style.color=cur>=3?'#ffd35a':'';
  $('rk-pos').textContent='#'+pos;$('rk-of').textContent=' / '+list.length;$('rk-sc').textContent=sc.toLocaleString();
  const g=gaugeHTML(sc,cur,start);$('rk-names').innerHTML=g.nm;$('rk-segs').innerHTML=g.sg}
// 5-tier window of the rank gauge (shared by the HUD and the result screen)
function gaugeHTML(sc,cur){const start=Math.max(0,Math.min(TIERS.length-5,cur-1));let nm='',sg='';
  for(let i=start;i<start+5;i++){const t=TIERS[i],nx=TIERS[i+1],f=nx?Math.max(0,Math.min(1,(sc-t.t)/(nx.t-t.t))):(sc>=t.t?1:0);
    nm+='<div'+(i===cur?' class="cur"':'')+'>'+tierSvg(i,20)+t.n+'</div>';
    sg+='<div class="sg"><i style="width:'+Math.round(f*100)+'%"></i><b>'+t.t.toLocaleString()+'</b></div>'}
  return {nm,sg}}
// score is scaled by each player's accuracy (hits / shots)
function adjScore(p){return Math.round(p.score*(p.shots?Math.min(1,p.hits/p.shots):1))}

// ?debug in the URL: on-screen frame-time / input stats to find stutter
const DBG=/[?&]debug/.test(location.search),dbg={el:null,last:0,max:0,n:0,t:0,ev:0,mx:0,lt:0};
if(DBG){dbg.el=document.createElement('pre');dbg.el.style.cssText='position:fixed;left:8px;bottom:8px;margin:0;padding:6px 8px;background:rgba(0,0,0,.7);color:#7CFC00;font:12px/1.4 monospace;z-index:99;pointer-events:none';document.body.append(dbg.el);
  Object.assign(dbg,{lag:0,gap:0,fe:0,p1:0,p2:0});
  // lag = how long after the OS timestamp the event reached JS; gap = a frame with no input between two frames that had input (stall then burst)
  document.addEventListener(MOVE_EV,e=>{dbg.ev++;dbg.fe++;dbg.mx=Math.max(dbg.mx,Math.abs(e.movementX)+Math.abs(e.movementY));dbg.lag=Math.max(dbg.lag,performance.now()-e.timeStamp)});
  try{new PerformanceObserver(l=>{for(const e of l.getEntries())dbg.lt=Math.max(dbg.lt,e.duration)}).observe({entryTypes:['longtask']})}catch(e){}}
function frame(){
  requestAnimationFrame(frame);const now=performance.now(),hn=hostNow();
  padUpdate(Math.min(0.05,(now-(frame.l||now))/1000));frame.l=now;
  if(DBG){if(dbg.last){const d=now-dbg.last;dbg.max=Math.max(dbg.max,d);dbg.n++}dbg.last=now;
    if(dbg.p1===0&&dbg.p2>0&&dbg.fe>0)dbg.gap++;dbg.p2=dbg.p1;dbg.p1=dbg.fe;dbg.fe=0;
    if(now-dbg.t>1000){dbg.el.textContent='fps '+dbg.n+'\nworst frame '+dbg.max.toFixed(1)+' ms\nlongest task '+dbg.lt.toFixed(0)+' ms\nmouse ev/s '+dbg.ev+'\nmax move/ev '+dbg.mx+' px\ninput lag max '+dbg.lag.toFixed(1)+' ms\ninput gaps '+dbg.gap+'\ntargets '+S.targets.size;dbg.t=now;dbg.n=0;dbg.max=0;dbg.ev=0;dbg.mx=0;dbg.lt=0;dbg.lag=0;dbg.gap=0}}
  if(S.phase==='menu'){camera.rotation.set(Math.sin(now/5000)*0.04,Math.sin(now/7000)*0.25,0)}else camera.rotation.set(pitch,yaw,0);
  for(const [id,g] of S.targets){const m=meshes.get(id);if(!m)continue;tpos(g,hn,V);m.position.set(V.x,V.y,V.z);
    m.scale.setScalar(g.r);if(g.ty==='c')updArc(m,g,(g.dl-hn)/g.ws);else updBar(m,g);
    const e=Math.max(Math.abs(V.x)/W,Math.abs(V.y)/H),out=V.x*g.dx+V.y*g.dy>0,dg=(g.ty==='h'||!out)?0:Math.max(0,Math.min(1,(e-0.75)/0.25)),fl=Math.max(0,1-(now-m.userData.flash)/150);
    cTmp.copy(m.userData.base).lerp(cRed,dg);m.material.color.copy(cTmp);m.material.emissive.copy(cTmp);
    m.material.emissiveIntensity=0.4+dg*0.5*(0.6+0.4*Math.sin(now/60))+fl*1.2}
  for(let i=effects.length-1;i>=0;i--){const f=effects[i],k=(now-f.t)/f.dur;
    if(k>=1){scene.remove(f.m);f.m.material.dispose();if(f.kind==='line')f.m.geometry.dispose();effects.splice(i,1);continue}
    if(f.kind==='ring'){f.m.scale.setScalar(f.r*(1+k*1.6));f.m.material.opacity=1-k}else f.m.material.opacity=0.7*(1-k)}
  frameMat.color.copy(cRed).lerp(cBase,Math.min(1,(now-frameFlash)/450));
  for(const p of S.players.values()){if(p.id===S.myId)continue;
    if(!p.ring){p.ring=new THREE.Mesh(ringGeo,new THREE.MeshBasicMaterial({color:COLORS[p.ci],transparent:true,opacity:0.85,depthTest:false}));p.ring.scale.setScalar(0.28);p.ring.renderOrder=5;scene.add(p.ring)}
    p.y+=(p.ty-p.y)*0.35;p.p+=(p.tp-p.p)*0.35;dirFrom(p.y,p.p,D);
    const vis=S.phase==='playing'&&D.z<-0.05;p.ring.visible=vis;if(vis){const k=(ZC+1.5)/D.z;p.ring.position.set(D.x*k,D.y*k,ZC+1.5)}
    if(!p.beam){p.beam=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,-1.4,-1.5),new THREE.Vector3(0,0,ZC)]),new THREE.LineBasicMaterial({color:COLORS[p.ci],transparent:true,opacity:0.6}));p.beam.frustumCulled=false;scene.add(p.beam)}
    const bv=vis&&!!p.f;p.beam.visible=bv;if(bv){const k=ZC/D.z,a=p.beam.geometry.attributes.position;a.setXYZ(1,D.x*k,D.y*k,ZC);a.needsUpdate=true}}
  if(S.phase==='playing'){const gt=(hn-S.t0)/1000,c=$('count');
    if(gt<0){c.hidden=false;c.textContent=Math.ceil(-gt)}else c.hidden=true;
    const ct=fmtT(gt),lv='LV '+(1+Math.floor(Math.max(0,gt)/20));
    if(ct!==lastClock){lastClock=ct;$('clock').textContent=ct}if(lv!==lastLv){lastLv=lv;$('lvl').textContent=lv}}
  else{$('count').hidden=true;if(S.phase==='over'&&S.over)$('clock').textContent=fmtT(S.over.time)}
  renderer.render(scene,camera);
}
syncSettings();refreshUI();frame();
</script>
